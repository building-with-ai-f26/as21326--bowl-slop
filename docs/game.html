<script>
// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 480, BASE_H = 640;  // internal game width; the height grows on tall (phone) screens so the game fills them
let H = BASE_H;               // set by fit(): 640 on laptops, up to ~1100 on phones in portrait
const menuOY = () => (H - BASE_H) / 2;   // menus are laid out for 640 tall; on taller screens they are centred
let viewScale = 1;           // backing-store pixels per game pixel (set by fit())
const WALL = 32;              // thickness of the side walls
const FLOOR_GAP = 90;         // vertical distance between floors
const STEP = 1 / 60;          // physics runs at a fixed 60 ticks/sec
const JUMP_BUFFER = 6;         // ticks: a jump pressed this shortly BEFORE landing still fires on landing
const COYOTE_TICKS = 5;        // ticks: you can still jump this long AFTER running off a ledge
const MAX_PARTICLES = 300;
const FONT = '"Press Start 2P", monospace';
const now = () => performance.now();
try { document.fonts?.load('10px "Press Start 2P"'); } catch (e) {}
const UNLOCK_ALL = true;      // everything playable (set false to turn the unlock shop on)
const START_FLOOR = 0;        // testing shortcut: runs start on this floor (override in the URL with ?floor=N)
const MOVING_FROM = 20;       // floors from this number up may slide left/right
const FLOOR_W_SCALE = 1.15;   // regular floors are 15% wider than the original 70..220 design
const MIN_FLOOR_W = 70 * FLOOR_W_SCALE;
const SLANT_FROM = 100;       // floors above this number may be tilted (slippery ramps)
const SLANT_SLIDE = 0.55;     // downhill pull per tick = sin(angle) * this (* 0.25 with grip boots)
const SLANT_FRICTION = 0.35;  // coasting friction on a slant is only this fraction of the normal friction, so you really slide
const SPEED_LIMIT = 40;       // safety ceiling only (~4.5x a normal run): without it, wall-to-wall bouncing grows speed to Infinity and crashes the game

// ---------- Parody characters (vector art drawn with canvas shapes) ----------
// Each character draws itself inside a 36x48 box, facing right, feet at the bottom.
// `t` is the run-animation phase, `air` is true while jumping.
const PW = 36, PH = 48;
const OUTLINE = '#1a1a2e';

function shape(fill, build) {
  ctx.beginPath(); build(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
}
const ellipse = (x, y, rx, ry, fill, rot = 0) => shape(fill, () => ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2));
const circle = (x, y, r, fill) => ellipse(x, y, r, r, fill);
const box = (x, y, w, h, r, fill) => shape(fill, () => ctx.roundRect(x, y, w, h, r));
const shine = (x0, y0, x1, y1, light, dark) => {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, light); g.addColorStop(1, dark);
  return g;
};
function eye(x, y, r, lookX = 0.4, lookY = 0) {
  ctx.lineWidth = 1;
  ellipse(x, y, r * 0.75, r, '#fff');
  ctx.beginPath(); ctx.arc(x + lookX * r * 0.4, y + lookY * r * 0.4, r * 0.45, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill();
  ctx.beginPath(); ctx.arc(x + lookX * r * 0.4 + r * 0.15, y + lookY * r * 0.4 - r * 0.2, r * 0.15, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 1.5;
}
// two legs that swing while running and tuck while jumping
function legs(t, air, hipY, drawLeg) {
  const swing = air ? 0 : Math.sin(t) * 4;
  const lift = air ? -4 : 0;
  drawLeg(13 - swing, hipY, 46 + lift + Math.max(0, -Math.sin(t)) * -2);
  drawLeg(23 + swing, hipY, 46 + lift + Math.max(0, Math.sin(t)) * -2);
}

const PARODY = [
  {
    name: 'Super Marinara',
    bio: "It's-a me, a pasta.",
    stats: { accel: 0.45, jump: 11, grip: 0.97 },
    draw(t, air) {
      legs(t, air, 38, (x, hip, foot) => {
        box(x - 3, hip, 6, foot - hip - 2, 2, '#1d4ed8');
        ellipse(x + 2, foot - 1, 5, 3, '#4a2c12');
      });
      // spaghetti hair hanging out the back
      ctx.save(); ctx.strokeStyle = '#e9c46a'; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(12 + i, 12);
        ctx.quadraticCurveTo(5 + i * 2, 18 + i * 2, 9 + i, 26 + i * 2 + Math.sin(t + i) * 1.5);
        ctx.stroke();
      }
      ctx.restore();
      ellipse(18, 32, 11, 8, shine(0, 24, 0, 40, '#ef4444', '#991b1b'));          // red shirt
      box(11, 28, 14, 12, 3, shine(0, 28, 0, 40, '#3b82f6', '#1e3a8a'));         // overalls bib
      circle(13.5, 31, 1.5, '#facc15'); circle(22.5, 31, 1.5, '#facc15');
      // fork arm
      ctx.save(); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(31, 36); ctx.lineTo(34, 18); ctx.stroke();
      for (const dx of [-1.5, 0, 1.5]) { ctx.beginPath(); ctx.moveTo(34 + dx, 18); ctx.lineTo(34.5 + dx, 13); ctx.stroke(); }
      ctx.restore();
      ellipse(28, 33, 4, 3, '#ef4444', -0.5); circle(31, 31, 2.8, '#fff');
      // head
      circle(19, 17, 9, shine(10, 8, 28, 26, '#fcd9a8', '#e0a96d'));
      ellipse(27, 19, 4, 3.2, '#f4a582');                                         // big nose
      ellipse(22, 23, 4, 2, '#4a2c12'); ellipse(28, 22.5, 4, 2, '#4a2c12');       // mustache
      eye(22, 14, 3);
      // colander hat
      shape(shine(10, 2, 28, 12, '#f1f5f9', '#94a3b8'), () => { ctx.arc(19, 11, 10, Math.PI, 0); ctx.closePath(); });
      ctx.fillStyle = '#334155';
      for (const [hx, hy] of [[14, 7], [19, 5], [24, 7], [16.5, 9.5], [21.5, 9.5]]) { ctx.beginPath(); ctx.arc(hx, hy, 0.9, 0, Math.PI * 2); ctx.fill(); }
      box(6, 10, 26, 3, 1.5, '#cbd5e1');
      ellipse(5, 11.5, 2.5, 1.8, '#94a3b8'); ellipse(33, 11.5, 2.5, 1.8, '#94a3b8');
    },
  },
  {
    name: 'Soggy the Hedgehog',
    bio: 'Gotta go... eventually.',
    stats: { accel: 0.5, jump: 10.5, grip: 0.985 },
    draw(t, air) {
      legs(t, air, 36, (x, hip, foot) => {
        box(x - 1.5, hip, 3, foot - hip - 2, 1.5, '#1e40af');
        ellipse(x + 2, foot - 1.5, 6, 3.2, shine(0, foot - 4, 0, foot, '#f87171', '#b91c1c'));
        ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, foot - 4); ctx.lineTo(x + 2, foot); ctx.stroke(); ctx.restore();
      });
      // droopy, waterlogged spines
      const blue = shine(0, 6, 0, 40, '#3b82f6', '#1e3a8a');
      for (const [tx, ty] of [[1, 30], [3, 24], [4, 17]]) {
        shape(blue, () => { ctx.moveTo(14, 10); ctx.quadraticCurveTo(tx - 2, ty - 8, tx, ty); ctx.lineTo(16, 22); ctx.closePath(); });
      }
      ellipse(17, 32, 8, 8, blue);
      ellipse(19, 33, 5, 5.5, '#fcd9a8');                                          // belly
      ellipse(27, 31, 4.5, 1.8, '#fcd9a8', 0.4); circle(30, 33, 2.5, '#fff');      // limp arm
      circle(19, 17, 10, blue);
      ellipse(25, 21, 6, 4, '#fcd9a8');                                            // muzzle
      circle(30.5, 19, 1.8, '#111');
      ctx.save(); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(26, 24.5, 2.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); ctx.restore(); // frown
      eye(23.5, 13.5, 4, 0.4, 0.6);
      // heavy eyelid makes him look sad
      shape('#2563eb', () => { ctx.ellipse(23.5, 13.5, 3.3, 4.3, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); });
      // tiny personal rain cloud, with drops that fall on a loop
      ctx.save(); ctx.lineWidth = 1;
      ellipse(15, -6, 5, 3, '#94a3b8'); ellipse(21, -7, 6, 4, '#94a3b8'); ellipse(26, -5, 4, 3, '#94a3b8');
      ctx.fillStyle = '#67e8f9';
      for (let i = 0; i < 3; i++) {
        const dy = ((t * 6 + i * 7) % 14);
        ctx.beginPath(); ctx.ellipse(15 + i * 5, -2 + dy, 0.9, 1.6, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    },
  },
  {
    name: 'Tax-Man',
    bio: 'Wakka wakka. You owe 30%.',
    stats: { accel: 0.38, jump: 12.5, grip: 0.97 },
    draw(t, air) {
      legs(t, air, 38, (x, hip, foot) => {
        ctx.save(); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x, hip); ctx.lineTo(x, foot - 2); ctx.stroke(); ctx.restore();
        ellipse(x + 2.5, foot - 1.5, 4.5, 2.2, '#111');
      });
      // receipt tape spilling from the mouth
      ctx.save(); ctx.lineWidth = 1;
      box(29, 22 + Math.sin(t) * 1.5, 7, 12, 1, '#f8fafc');
      ctx.strokeStyle = '#94a3b8';
      for (let ly = 25; ly < 33; ly += 2.5) { ctx.beginPath(); ctx.moveTo(30.5, ly + Math.sin(t) * 1.5); ctx.lineTo(34.5, ly + Math.sin(t) * 1.5); ctx.stroke(); }
      ctx.restore();
      // chomping body: the mouth opens and closes as he runs
      const open = air ? 0.55 : 0.15 + Math.abs(Math.sin(t)) * 0.4;
      shape(shine(6, 10, 30, 42, '#fde047', '#ca8a04'), () => { ctx.moveTo(18, 26); ctx.arc(18, 26, 15, open, Math.PI * 2 - open); ctx.closePath(); });
      shape('#dc2626', () => { ctx.moveTo(15, 38); ctx.lineTo(19, 38); ctx.lineTo(18.5, 44); ctx.lineTo(17, 46); ctx.lineTo(15.5, 44); ctx.closePath(); }); // necktie
      eye(19, 18, 3);
      ctx.save(); ctx.lineWidth = 1.2; ctx.strokeStyle = '#78350f';
      ctx.beginPath(); ctx.arc(19.5, 18, 4.5, 0, Math.PI * 2); ctx.stroke();            // reading glasses
      ctx.beginPath(); ctx.moveTo(15, 18); ctx.lineTo(8, 16); ctx.stroke();
      ctx.restore();
      // green accountant's visor
      ctx.save(); ctx.globalAlpha = 0.85;
      shape(shine(0, 6, 0, 14, '#4ade80', '#15803d'), () => { ctx.moveTo(5, 13); ctx.quadraticCurveTo(16, 4, 27, 9); ctx.lineTo(35, 13); ctx.lineTo(25, 14); ctx.quadraticCurveTo(15, 11, 5, 15); ctx.closePath(); });
      ctx.restore();
    },
  },
  {
    name: 'Lunk',
    bio: 'Dangerous to go alone. Take this bread.',
    stats: { accel: 0.42, jump: 11.5, grip: 0.96 },
    draw(t, air) {
      legs(t, air, 38, (x, hip, foot) => {
        box(x - 2.5, hip, 5, foot - hip - 4, 2, '#f5e6c8');
        box(x - 3, foot - 7, 7, 7, 2, '#78350f');
      });
      // floppy cap tail behind the head
      shape(shine(0, 4, 0, 28, '#4ade80', '#15803d'), () => { ctx.moveTo(12, 8); ctx.quadraticCurveTo(0, 12, 2, 28 + Math.sin(t) * 2); ctx.quadraticCurveTo(8, 18, 14, 16); ctx.closePath(); });
      // tunic, belt, buckle
      shape(shine(0, 24, 0, 42, '#22c55e', '#166534'), () => { ctx.moveTo(11, 25); ctx.lineTo(25, 25); ctx.lineTo(28, 41); ctx.lineTo(8, 41); ctx.closePath(); });
      box(9, 32, 18, 3, 1, '#78350f'); box(16, 31.5, 4, 4, 1, '#facc15');
      // baguette held up like a legendary sword
      ctx.save(); ctx.translate(29, 31); ctx.rotate(0.5 + (air ? 0.4 : Math.sin(t) * 0.1));
      box(-2.5, -24, 5, 26, 2.5, shine(-3, 0, 3, 0, '#e9b872', '#b07936'));
      ctx.strokeStyle = '#7c4a1e'; ctx.lineWidth = 1;
      for (let s = -20; s < 0; s += 5) { ctx.beginPath(); ctx.moveTo(-1.5, s); ctx.lineTo(1.5, s + 2.5); ctx.stroke(); }
      ctx.restore();
      circle(28, 31, 2.8, '#fcd9a8');                                              // hand
      // head, pointy ear, hair
      shape('#fcd9a8', () => { ctx.moveTo(11, 15); ctx.lineTo(4, 11); ctx.lineTo(12, 19); ctx.closePath(); });
      circle(18, 17, 8.5, shine(10, 8, 26, 26, '#fde4c3', '#e0a96d'));
      shape('#fde047', () => { ctx.moveTo(10, 14); ctx.quadraticCurveTo(18, 7, 27, 14); ctx.lineTo(24, 12); ctx.lineTo(22, 15); ctx.lineTo(19, 12); ctx.lineTo(16, 15); ctx.closePath(); });
      eye(17.5, 17, 2.6, -0.6, 0.2); eye(23, 17, 2.6, 0.8, -0.3);                  // eyes pointing two ways
      ctx.save(); ctx.lineWidth = 1; ellipse(21, 22.5, 1.8, 1.4, '#7f1d1d'); ctx.restore();  // open mouth
      // cap
      shape(shine(0, 3, 0, 12, '#4ade80', '#15803d'), () => { ctx.moveTo(9, 13); ctx.quadraticCurveTo(18, 0, 27, 12); ctx.quadraticCurveTo(18, 8, 9, 13); ctx.closePath(); });
    },
  },
];

// Roster: the four parody heroes, with their id / weight / perk merged in
const CHARACTERS = [
  ...PARODY.map(c => {
    const t = PARODY_TRAITS[c.name];
    return { ...c, id: t.id, stats: { ...c.stats, weight: t.weight }, perk: t.perk };
  }),
];
const perkOf = ch => (ch.perk && ch.perk.id) || 'none';

// Stat bars: each stat is scaled across the whole roster to 1..8 segments (grip is inverted: lower = grippier)
const STAT_ROWS = [
  { label: 'SPEED',  get: c => c.stats.accel },
  { label: 'JUMP',   get: c => c.stats.jump },
  { label: 'GRIP',   get: c => -c.stats.grip },
  { label: 'WEIGHT', get: c => c.stats.weight },
];
for (const r of STAT_ROWS) {
  const vals = CHARACTERS.map(r.get);
  r.min = Math.min(...vals); r.max = Math.max(...vals);
}
const statSegments = (r, ch) => r.max === r.min ? 4 : 1 + Math.round((r.get(ch) - r.min) / (r.max - r.min) * 7);

// Call an optional art-style draw function. If it throws midway, undo any ctx.save() it left open
// (otherwise the canvas state stack is off by one and everything drawn afterwards is garbled).
function safeArtCall(fn, args) {
  let depth = 0;
  const save = ctx.save, restore = ctx.restore;
  ctx.save = function () { depth++; save.call(this); };
  ctx.restore = function () { depth--; restore.call(this); };
  try { fn(...args); return true; }
  catch (e) { while (depth-- > 0) restore.call(ctx); return false; }
  finally { ctx.save = save; ctx.restore = restore; }
}

function drawSprite(ch, x, y, facing, angle = 0, squash = 1, t = 0, air = false, speed = 0) {
  ctx.save();
  ctx.translate(x + PW / 2, y + PH);           // pivot at the feet
  ctx.rotate(angle);
  ctx.scale(facing, squash);
  ctx.translate(-PW / 2, -PH);
  ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = OUTLINE;
  const st = artStyle(), fn = st && st.heroes && st.heroes[ch.id];
  if (typeof fn === 'function' && !artBroken.has(artKey + ':h:' + ch.id)) {
    const sm = ctx.imageSmoothingEnabled;
    if (artPixelish(st)) ctx.imageSmoothingEnabled = false;
    if (!safeArtCall(fn, [t, air, speed])) artBroken.add(artKey + ':h:' + ch.id);
    ctx.imageSmoothingEnabled = sm;
  } else ch.draw(t, air);
  ctx.restore();
}

// ---------- Input ----------
const keys = {};
let jumpBuf = 0;                 // ticks left on a buffered jump press (set by a NEW keydown / tap only)
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  const wasHeld = keys[e.code];
  keys[e.code] = true;
  // Jumping is edge-triggered: only a fresh press (not OS key-repeat, not a key already held) counts
  if (!e.repeat && !wasHeld && ['Space', 'ArrowUp', 'KeyW'].includes(e.code)) jumpBuf = JUMP_BUFFER;
  if (e.code === 'KeyM' && !e.repeat) window.music?.toggleMute();
  onKeyPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
// If the window loses focus mid-press, the keyup never arrives, so forget every held key / finger
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touches.clear(); recalcTouches(); });

// ---------- Touch, tilt and mouse input ----------
// Everything goes through Pointer Events (one API for finger, pen and mouse), so a tap can never fire twice.
// Game-over / menu taps act on pointerdown. A few things need a "real" user gesture (iOS tilt permission, window.open),
// so those run from touchend / click instead.
const CTRL_KEY = 'neverest-controls-v2';   // v2: steering changed to 'dip' (roll), so old saved choices are reset
let isTouch = false;
try { isTouch = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches); } catch (e) {}
const HAS_TILT_API = typeof window.DeviceOrientationEvent !== 'undefined';
let controlMode = isTouch && HAS_TILT_API ? 'tilt' : 'touch';   // phones: 'tilt' by default | 'touch' (on-screen zones). Computers use the keyboard either way.
try { const c = localStorage.getItem(CTRL_KEY); if (c === 'tilt' && HAS_TILT_API || c === 'touch') controlMode = c; } catch (e) {}
function setControlMode(m, persist) {
  controlMode = m;
  if (persist) { try { localStorage.setItem(CTRL_KEY, m); } catch (e) {} }
  touches.clear(); recalcTouches();
}

const touches = new Map();       // pointerId -> { role: 'left' | 'right' | 'jump', x }
let touchLeft = false, touchRight = false, touchJump = false;
function recalcTouches() {
  touchLeft = touchRight = touchJump = false;
  for (const t of touches.values()) { if (t.role === 'left') touchLeft = true; else if (t.role === 'right') touchRight = true; else touchJump = true; }
}

// Pointer position in game (canvas) coordinates, whatever size the canvas is drawn at
function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  const w = r.width || W, h = r.height || H;
  return { x: Math.max(0, Math.min(W, (e.clientX - r.left) * W / w)), y: Math.max(0, Math.min(H, (e.clientY - r.top) * H / h)) };
}
const hit = (r, p) => !!r && p.x >= r[0] && p.x <= r[0] + r[2] && p.y >= r[1] && p.y <= r[1] + r[3];

addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') isTouch = true;
  else if (e.pointerType === 'mouse' && e.button !== 0) return;
  const p = toCanvas(e);
  if (mode === 'play') { if (e.pointerType !== 'mouse') playTouchDown(e.pointerId, p); }   // on laptops the mouse does nothing mid-run
  else menuTap(p);
});
addEventListener('pointermove', e => {
  const t = touches.get(e.pointerId);
  if (t && t.role !== 'jump') { t.role = toCanvas(e).x < W / 2 ? 'left' : 'right'; recalcTouches(); }   // slide a finger across to switch direction
});
const pointerEnd = e => { if (touches.delete(e.pointerId)) recalcTouches(); };
addEventListener('pointerup', pointerEnd);
addEventListener('pointercancel', pointerEnd);
addEventListener('touchend', () => { if (tiltState === 'unknown' && controlMode === 'tilt') requestTilt(); });   // iOS asks for motion access only once you pick tilt (needs a touchend/click gesture)
for (const ev of ['gesturestart', 'gesturechange', 'contextmenu', 'selectstart', 'dragstart']) addEventListener(ev, e => e.preventDefault());

// A finger in play. TILT mode: any touch = jump. TOUCH mode: left third / right third = move while held,
// middle third = jump, and a second finger anywhere (while one is already steering) = jump.
function playTouchDown(id, p) {
  let role = 'jump';
  if (controlMode === 'touch') {
    const steering = [...touches.values()].some(t => t.role !== 'jump');
    if (!steering) role = p.x < W / 3 ? 'left' : p.x > W * 2 / 3 ? 'right' : 'jump';
  }
  touches.set(id, { role, x: p.x });

  recalcTouches();

// Tilt: gamma/beta from deviceorientation, calibrated to whatever angle the phone is at when the run starts
let tiltState = !HAS_TILT_API ? 'unavailable' : (typeof DeviceOrientationEvent.requestPermission === 'function' ? 'unknown' : 'granted');

if (tiltState === 'unavailable' && controlMode === 'tilt') controlMode = 'touch';
const screenAngle = () => { try { return ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) | 0; } catch (e) { return 0; } };

  // Portrait: steer by "dipping" a side of the phone down (roll), however upright you hold it. gamma alone goes haywire
  // when the phone is held upright, so use how far the screen's left-right axis points down: asin(sin(gamma) * cos(beta)).
  const D = Math.PI / 180;
  const roll = Math.asin(Math.max(-1, Math.min(1, Math.sin(e.gamma * D) * Math.cos(e.beta * D)))) / D;
  const raw = a === 90 ? e.beta : a === 270 ? -e.beta : a === 180 ? -roll : roll;

const recalibrateTilt = () => { tiltNeutral = null; tiltVal = 0; };
try { screen.orientation.addEventListener('change', recalibrateTilt); } catch (e) {}
addEventListener('orientationchange', recalibrateTilt);

function requestTilt() {                           // call from inside a user gesture

// The tilt direction as -1..1 (analog: 6 degrees of deadzone, then a gentle curve up to full speed at 30 degrees)

const flash = msg => { message = msg; messageTimer = 120; };

const left = () => keys.ArrowLeft || keys.KeyA || touchLeft || tiltAxis() < 0;
const right = () => keys.ArrowRight || keys.KeyD || touchRight || tiltAxis() > 0;

const rightAmt = () => (keys.ArrowRight || keys.KeyD || touchRight) ? 1 : Math.max(0, tiltAxis());

let overAt = 0;                  // when the run ended (ms): ignores accidental taps right after a death, times the end-card fade
let selected = 0;
let player, floors, camY, scrollSpeed, elapsed, score, bestFloor, combo, comboTimer, lastFloor, message, messageTimer;
let kickChain = 0, fire = false, fireGlow = 0, fireMsgTimer = 0, shake = 0, musicTick = 0;
let pickups = [], powerT = { spring: 0, grip: 0 };   // floating powerups {type,f,phase}; remaining ticks per active powerup
let particles = [];              // {x,y,vx,vy,life,max,color,size,type[,text]} in world space; types: dust|spark|flame|confetti|text
let highScore = 0;
try { highScore = Number(localStorage.getItem('slipup-high')) || 0; } catch (e) {}

const QS = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();   // ?floor=48 starts higher (testing)
// ---------- Art styles: 'classic' (the built-in drawings) + whatever art-*.js registered in window.ART_STYLES ----------
// ART_STYLES[key] = { label, heroes: {id: draw(t, air, speed)}, villains: {id: draw(t, firing)} }. A missing art file just means fewer styles.
const ART_KEY = 'neverest-art-v2';     // v2: so a style picked while testing doesn't override the new default
const ART_ORDER = [];
const DEFAULT_ART = 'classic';

const artBroken = new Set();     // style:character combos whose draw threw once: they fall back to classic from then on
const artRegistry = () => (window.ART_STYLES && typeof window.ART_STYLES === 'object') ? window.ART_STYLES : {};

}
let artKey = artKeys().includes(DEFAULT_ART) ? DEFAULT_ART : 'classic';
try {

const artStyle = () => (artKey === 'classic' ? null : artRegistry()[artKey] || null);

// ---------- Wallet and unlocks (banked points buy characters; OFF while UNLOCK_ALL is true) ----------
const PRICES = [0, 0, 500, 1000, 1500, 2500, 3500, 5000, 6500, 8000, 10000, 12000];   // same order as CHARACTERS
let wallet = 0, lastGain = 0, unlockOverride = null, needFlash = 0, needPrice = 0;
let unlocked = CHARACTERS.filter((c, i) => PRICES[i] === 0).map(c => c.id);
try {
  wallet = Number(localStorage.getItem('neverest-wallet')) || 0;
  const saved = JSON.parse(localStorage.getItem('neverest-unlocked'));
  if (Array.isArray(saved)) unlocked = [...new Set([...unlocked, ...saved])];
} catch (e) {}
const saveWallet = () => { try { localStorage.setItem('neverest-wallet', String(wallet)); } catch (e) {} };
const saveUnlocked = () => { try { localStorage.setItem('neverest-unlocked', JSON.stringify(unlocked)); } catch (e) {} };
const unlockAll = () => (unlockOverride === null ? UNLOCK_ALL : unlockOverride);   // U key flips unlockOverride for this session
const isUnlocked = i => unlockAll() || unlocked.includes(CHARACTERS[i].id);

// Start a run. On iOS the first tilt run waits for the motion-permission prompt (shown from the touchend of this same tap).
function startRun() {
  if (tiltState === 'pending' || (tiltState === 'unknown' && isTouch && controlMode === 'tilt')) {
    pendingStart = startGame;
    // Safety net: if no tap ever shows the prompt (e.g. an iPad started with a keyboard), don't hang:
    // after 3 seconds switch to touch controls and start anyway. The token + checks make sure a stale
    // timer never starts a run you didn't ask for (another start happened, you changed character,
    // left the screen, or a real permission prompt is open and waiting for you).
    const tok = ++startToken, who = selected, from = mode;
    setTimeout(() => {
      if (tok !== startToken || pendingStart !== startGame || selected !== who || mode !== from || tiltState !== 'unknown') return;
      pendingStart = null;
      tiltState = 'denied'; setControlMode('touch', false);
      startGame();
    }, 3000);
    return;
  }
  startGame();
}

function tryStartOrBuy() {                       // ENTER on the select screen
  if (isUnlocked(selected)) { startRun(); return; }
  const price = PRICES[selected];
  if (wallet >= price) {
    wallet -= price; unlocked.push(CHARACTERS[selected].id); saveWallet(); saveUnlocked();
    window.sfx?.('combo');
  } else {
    needFlash = 40; needPrice = price - wallet; window.sfx?.('warn');
  }
}

// Linear blend a->b as n goes from n0 to n1 (clamped), used for all the "gets harder with height" numbers
function ramp(n, n0, n1, a, b) { return a + (b - a) * Math.max(0, Math.min(1, (n - n0) / (n1 - n0))); }

function addFloor(n) { const f = makeFloor(n); floors.push(f); maybePickup(f); return f; }

function makeFloor(n) {
  const y = -n * FLOOR_GAP;
  if (n === 0 || n % 50 === 0) return { n, y, x: WALL, w: W - 2 * WALL };   // full-width checkpoint floors
  const maxW = Math.max(MIN_FLOOR_W, (220 - n * 1.2) * FLOOR_W_SCALE);   // floors get narrower as you climb (all widths x1.15 to be friendlier)
  const w = Math.min(W - 2 * WALL, MIN_FLOOR_W + Math.random() * (maxW - MIN_FLOOR_W));
  const x = WALL + Math.random() * (W - 2 * WALL - w);
  const f = { n, y, x, w };
  if (n > SLANT_FROM && Math.random() < ramp(n, SLANT_FROM, 250, 0.20, 0.55)) {   // slanted ramp: never also moving
    f.slant = (Math.random() < 0.5 ? -1 : 1) * ramp(n, SLANT_FROM, 250, 6, 16) * Math.PI / 180;
  } else if (n >= MOVING_FROM && Math.random() < ramp(n, MOVING_FROM, 120, 0.25, 0.6)) makeMoving(f);
  return f;
}

// Height of a floor's walking surface at world x (flat floors: just f.y; slanted: tilted about the floor's centre)
const surfaceY = (f, x) => (f.slant ? f.y + (x - (f.x + f.w / 2)) * Math.tan(f.slant) : f.y);

// Turn a floor into a horizontal slider. x = baseX + sin(phase) * range, so it never leaves the walls.
function makeMoving(f) {
  const avail = W - 2 * WALL - f.w;                       // free space left and right of the floor
  const range = Math.min(40 + Math.random() * 70, avail / 2);
  f.moving = true;
  f.range = range;
  f.baseX = WALL + range + Math.random() * (avail - 2 * range);
  f.speed = ramp(f.n, MOVING_FROM, 160, 0.6, 2.2);        // peak speed in px per tick
  f.phase = Math.random() * Math.PI * 2;
  f.dx = 0;                                               // how far it moved this tick (riders get carried by it)
  f.x = f.baseX + Math.sin(f.phase) * range;
}

// Advance every moving floor one tick and remember the movement
function updateMovingFloors() {
  for (const f of floors) {
    if (!f.moving) continue;
    f.phase += f.speed / f.range;                         // angular speed chosen so peak linear speed = f.speed
    const nx = f.baseX + Math.sin(f.phase) * f.range;
    f.dx = nx - f.x; f.x = nx;
  }
}

// ?floor=N in the URL (else START_FLOOR): validated, clamped to a sane range
function getStartFloor() {
  let n = START_FLOOR;
  try {
    const v = new URLSearchParams(location.search).get('floor');
    if (v !== null && /^\d+$/.test(v)) n = parseInt(v, 10);
  } catch (e) {}
  return Number.isFinite(n) ? Math.max(0, Math.min(5000, Math.floor(n))) : 0;
}

function startGame() {
  startToken++;
  const ch = CHARACTERS[selected];
  const startN = getStartFloor();
  player = { ch, x: W / 2 - PW / 2, y: -PH, vx: 0, vy: 0, onGround: true, facing: 1, angle: 0, squash: 1, floor: 0, anim: 0, wallKick: 0, coyote: 0, airJumps: 0, flaps: 0, on: null };   // on = the floor object we stand on (null in the air)

  scrollSpeed = 0;

// ---------- Menu taps (finger or mouse). Hit boxes live here so the drawing code and the tap code share them. ----------
const R = {
  prev: [0, 84, 150, 130], next: [330, 84, 150, 130],       // left / right of the big sprite = previous / next hero
  name: [150, 84, 180, 190],                                 // sprite centre + name / bio / perk = start
  start: [100, 506, 280, 54], ctrl: [60, 562, 360, 52], ctrlFull: [60, 562, 360, 52],
  change: [90, 398, 300, 48],

const thumbRect = i => [60 + (i % 6) * 60, 377 + Math.floor(i / 6) * 62, 60, 62];
const stepSelected = d => { selected = (selected + CHARACTERS.length + d) % CHARACTERS.length; window.sfx?.('select'); };

function menuTap(p) {
  p = { x: p.x, y: p.y - menuOY() };                         // hit boxes are in the 640-tall menu layout
  if (mode === 'select') {
    if (isTouch && hit(R.ctrl, p)) { toggleControls(); return; }
    if (hit(R.prev, p)) { stepSelected(-1); return; }
    if (hit(R.next, p)) { stepSelected(1); return; }
    if (hit(R.name, p) || hit(R.start, p)) { tryStartOrBuy(); return; }
    for (let i = 0; i < CHARACTERS.length; i++) {
      if (!hit(thumbRect(i), p)) continue;
      if (i === selected) tryStartOrBuy(); else { selected = i; window.sfx?.('select'); }
      return;
    }
    startRun();
  } else if (mode === 'over') {
    if (now() - overAt < 500) return;                        // don't let a frantic jump-tap at death restart the run
    if (hit(R.change, p)) { mode = 'select'; window.music?.start('menu'); return; }
    startRun();
  }
}

function onKeyPress(code) {
  if (mode === 'select') {
    if (code === 'ArrowLeft' || code === 'KeyA') { selected = (selected + CHARACTERS.length - 1) % CHARACTERS.length; window.sfx?.('select'); }
    if (code === 'ArrowRight' || code === 'KeyD') { selected = (selected + 1) % CHARACTERS.length; window.sfx?.('select'); }
    if (code === 'Enter' || code === 'Space') tryStartOrBuy();
    if (code === 'KeyU') unlockOverride = !unlockAll();   // secret: flip the unlock shop on/off for this session
  } else if (mode === 'over') {
    if (code === 'KeyR' || code === 'Enter') startRun();
    if (code === 'KeyC') { mode = 'select'; window.music?.start('menu'); }
  }
}

// ---------- Physics (one fixed 1/60s tick) ----------
function update() {
  const p = player, s = p.ch.stats;

  const grounded0 = p.onGround, prevOn = p.on;                 // standing at the start of this tick? (tells a fresh landing from standing still)
  elapsed += STEP;

    setControlMode('touch', false); flash('NO TILT SENSOR: TOUCH CONTROLS');
  }
  updateMovingFloors();
  if (grounded0 && p.on) p.x += p.on.dx || 0;   // ride the moving floor we were standing on

  // Ice: holding a direction speeds you up; letting go you keep sliding (grip close to 1 = slippery)
  // but a little stickier than before: extra decay when coasting, extra brake when reversing
  const perk = perkOf(p.ch);
  const limit = perk === 'speed' ? 46 : SPEED_LIMIT;          // speed perk: higher top speed
  const groundAccel = perk === 'speed' ? s.accel * 1.1 : s.accel;  // ...and +10% ground accel
  const accel = p.onGround ? groundAccel : s.accel * 0.6;
  const lAmt = leftAmt(), rAmt = rightAmt();     // 0 or 1 for keys / touch; 0..1 for tilt
  const gripOn = powerT.grip > 0, springOn = powerT.spring > 0;
  const slope = (p.onGround && prevOn && prevOn.slant) || 0;      // tilt of the floor we are standing on (radians, 0 = flat)
  if (p.onGround && ((lAmt > 0 && p.vx > 0) || (rAmt > 0 && p.vx < 0))) p.vx *= Math.max(gripOn ? 0.65 : 0.8, (gripOn ? 0.78 : 0.92) - 0.03 * (weight - 1));
  if (lAmt > 0) { p.vx -= accel * lAmt; p.facing = -1; }
  if (rAmt > 0) { p.vx += accel * rAmt; p.facing = 1; }
  if (slope) p.vx += Math.sin(slope) * SLANT_SLIDE * (gripOn ? 0.25 : 1);   // gravity pulls you down the ramp
  if (lAmt === 0 && rAmt === 0 && p.onGround) {
    let decay = gripOn ? 0.85 : s.grip - 0.025 - 0.02 * (weight - 1);
    if (slope) decay = 1 - (1 - decay) * SLANT_FRICTION;            // ice on a slope: much weaker friction
    p.vx *= decay;

  // drag (lose 1% of your speed every tick), so speed builds up gradually.
  p.vx *= 0.99;

  if (p.onGround) p.anim += Math.abs(p.vx) * 0.12;

  // The faster you're running, the higher you jump — the core trick of the genre.
  // Jump within a split second of bouncing off a wall for a bonus "wall kick" super jump.
  // Jumps need a fresh press (jumpBuf), and are forgiving: a press just before landing is buffered,
  // and you can still jump for a few ticks after leaving a ledge (coyote time).
  if (p.onGround) p.coyote = COYOTE_TICKS; else if (p.coyote > 0) p.coyote--;
  if (jumpBuf > 0 && p.coyote > 0) {
    const kick = p.wallKick > 0;
    p.vy = -(s.jump + Math.abs(p.vx) * 0.9 + (kick ? 3 : 0)) * (springOn ? 1.3 : 1);
    p.onGround = false; p.coyote = 0; jumpBuf = 0;
    p.squash = 1.3;
    if (kick) wallKickJump(); else window.sfx?.('jump');
  } else if (jumpBuf > 0 && !p.onGround && !(perk === 'airjump' && p.vy > 0 && floorJustBelow(p, 24))) {
    airPerkJump(p, perk, s);                    // no ground jump available: airjump / flutter perks may use the press
    // (an airjump press made just before landing is NOT spent mid-air: it stays buffered and becomes the ground jump)
  }
  if (jumpBuf > 0) jumpBuf--;
  if (p.wallKick > 0) p.wallKick--;

  let grav = 0.55 * (0.9 + 0.1 * weight);       // gravity (mildly heavier for heavy characters)
  if (perk === 'float' && !p.onGround && jumpHeld() && Math.abs(p.vy) < 2.5) grav *= 0.35;   // float: hang time near the top
  p.vy += grav;
  if (perk === 'glide' && p.vy > 6 && jumpHeld()) p.vy = 6;   // glide: cape/umbrella caps the fall speed
  if (!jumpHeld() && p.vy < -4) p.vy += 0.4;    // let go early for a shorter hop

  p.x += p.vx;

  p.y += p.vy;

  // Walls: hit one fast and you bounce off FASTER than you came in (like the classic genre trick),
  // which opens a short window to time a wall-kick jump
  if (p.x < WALL || p.x + PW > W - WALL) {
    p.x = p.x < WALL ? WALL : W - WALL - PW;

      p.wallKick = perk === 'kickwindow' ? 20 : 12;   // normally 12 ticks = 0.2 seconds to press jump
      shake = Math.max(shake, 2);
      for (let i = 0; i < 5; i++) spawn(p.x < W / 2 ? WALL : W - WALL, p.y + PH / 2, -Math.sign(p.vx) * (1 + Math.random() * 3), (Math.random() - 0.7) * 3, 14 + Math.random() * 8, '#fde047', 2, 'spark');
      if (!p.onGround && p.vy < 0) p.vy -= 2;   // wall kick: slide up the wall

  if (p.vy >= 0) {
    if (grounded0 && prevOn && prevOn.slant && onSpan(prevOn)) {   // standing on a ramp: glue to the surface as we move; off the end = fall
      p.y = surfaceY(prevOn, pcx) - PH; p.vy = 0; p.onGround = true; p.on = prevOn; p.angle = prevOn.slant; p.squash = 0.8;
      p.airJumps = 0; p.flaps = 0;
      landOn(prevOn.n, false);
    } else for (const f of floors) {
      const bottom = p.y + PH;
      const overlaps = f.slant ? onSpan(f) : (p.x + PW - 8 > f.x && p.x + 8 < f.x + f.w);
      const sy = surfaceY(f, pcx), prevSy = surfaceY(f, Math.max(f.x, Math.min(f.x + f.w, prevCx)));   // clamp: never read the ramp's height past its ends
      if (overlaps && prevBottom <= prevSy && bottom >= sy) {   // was above the surface (where we were), now at/below it (where we are)
        const impact = p.vy;
        p.y = sy - PH; p.vy = 0; p.onGround = true; p.on = f; p.angle = f.slant || 0; p.squash = 0.8;
        p.airJumps = 0; p.flaps = 0;            // airjump / flutter refill on every landing
        if (!grounded0) landFx(sy, impact);
        landOn(f.n, !grounded0);
        // bounce perk: a hard fresh landing (impact > 9) pops you up a little. The hop lands softer, so it can't loop.
        if (perk === 'bounce' && !grounded0 && impact > 9) { p.vy = -impact * 0.45; p.onGround = false; p.coyote = COYOTE_TICKS; }
        break;
      }
    }
  }

  // Spin during big jumps, just for style
  if (!p.onGround && p.vy < -15) p.angle += 0.25 * p.facing;
  else if (!p.onGround && Math.abs(p.angle) < 0.35) p.angle *= 0.8;   // leaving a ramp: ease the tilt back to upright
  p.squash += (1 - p.squash) * 0.2;

  // Spawn floors above, drop ones far below
  while (floors[floors.length - 1].y > camY - FLOOR_GAP * 2) addFloor(floors[floors.length - 1].n + 1);
  floors = floors.filter(f => f.y < camY + H + FLOOR_GAP);

  // The tower "comes down": camera starts creeping up after 5s and speeds up over time
  if (elapsed > 5) scrollSpeed = Math.min(5, 0.6 + (elapsed - 5) / 25);
  camY -= scrollSpeed;
  const pushLine = camY + H * 0.3;              // climbing fast pulls the camera up with you
  if (p.y < pushLine) camY -= (pushLine - p.y) * 0.15;

  updatePickups();
  if (comboTimer > 0 && --comboTimer === 0) endCombo();
  if (messageTimer > 0) messageTimer--;
  if (fireMsgTimer > 0) fireMsgTimer--;

  updateFire();
  updateEnemy();
  if (hitFlash > 0) hitFlash--;
  if (fire) {                                   // flame trail + sparkles while on fire
    const cx = p.x + PW / 2, cy = p.y + PH * 0.6;
    for (let i = 0; i < 2; i++) spawn(cx + (Math.random() - 0.5) * 14, cy + (Math.random() - 0.5) * 20, -p.vx * 0.15 + (Math.random() - 0.5), -0.5 - Math.random() * 1.2, 18 + Math.random() * 14, ['#ef4444', '#fb923c', '#fde047'][i + (Math.random() < 0.4 ? 1 : 0)] , 4 + Math.random() * 3, 'flame');
    if (Math.random() < 0.3) spawn(cx + (Math.random() - 0.5) * 40, cy + (Math.random() - 0.5) * 50, (Math.random() - 0.5) * 2, -1 - Math.random(), 20, Math.random() < 0.5 ? '#fff' : '#fde047', 2, 'spark');
  }
  fireGlow += ((fire ? 1 : 0) - fireGlow) * 0.05;
  shake *= 0.85;
  updateParticles();
  if (++musicTick % 30 === 0) window.music?.setIntensity(Math.max(0, Math.min(1, scrollSpeed / 5 + (fire ? 0.3 : 0))));

  if (p.y > camY + H) gameOver();
}

// Is there a floor we are about to land on, within `dist` px under the feet? (same sideways overlap test as landing)
function floorJustBelow(p, dist) {
  const feet = p.y + PH;
  const cx = p.x + PW / 2;
  return floors.some(f => (f.slant ? cx >= f.x && cx <= f.x + f.w : p.x + PW - 8 > f.x && p.x + 8 < f.x + f.w) && surfaceY(f, cx) >= feet - 1 && surfaceY(f, cx) - feet <= dist);
}

// Air perks: a NEW jump press while airborne (and past coyote time)
function airPerkJump(p, perk, s) {
  if (perk === 'airjump' && p.airJumps < 1) {    // one extra full-ish jump per airtime
    p.airJumps++; p.vy = -(s.jump * 0.85); jumpBuf = 0;
    for (let i = 0; i < 10; i++) spawn(p.x + PW / 2, p.y + PH, (Math.random() - 0.5) * 4, Math.random() * 1.5, 18 + Math.random() * 8, '#fff', 3 + Math.random() * 2, 'dust');
    window.sfx?.('jump');
  } else if (perk === 'flutter' && p.flaps < 3) {  // up to 3 small flaps per airtime
    p.flaps++; p.vy = Math.min(p.vy, -4); jumpBuf = 0;
    window.sfx?.('jump');
  }
}

// ---------- Powerups: floating badges (from floor 5, ~1 in 9 floors, max 3 alive) ----------
const POWER = {
  spring: { label: 'JUMP BOOST!', secs: 10, color: '#22c55e' },     // jump velocity x1.3
  grip:   { label: 'GRIP BOOTS!', secs: 12, color: '#f97316' },     // much less slippery (coast decay 0.85, slant slide x0.25, harder braking)
};
function maybePickup(f) {
  if (f.n < 5 || pickups.length >= 3 || Math.random() >= 1 / 9) return;
  pickups.push({ type: Math.random() < 0.5 ? 'spring' : 'grip', f, phase: Math.random() * 6.28 });
}
const pickupPos = k => { const x = k.f.x + k.f.w / 2; return { x, y: surfaceY(k.f, x) - 26 }; };   // rides moving floors, sits above a slope
function updatePickups() {
  const p = player;
  for (const t in powerT) if (powerT[t] > 0) powerT[t]--;
  pickups = pickups.filter(k => {
    const q = pickupPos(k);
    if (q.y - camY > H + 40) return false;                       // scrolled off the bottom
    if (Math.abs(q.x - (p.x + PW / 2)) < PW / 2 + 11 && Math.abs(q.y - (p.y + PH / 2)) < PH / 2 + 11) { collectPickup(k, q); return false; }
    return true;
  });
}
function collectPickup(k, q) {
  const def = POWER[k.type];
  powerT[k.type] = def.secs * 60;                                // same type = timer refresh; the other type keeps running
  for (let i = 0; i < 18; i++) spawn(q.x, q.y, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6 - 1, 20 + Math.random() * 14, i % 3 ? def.color : '#fff', 2 + Math.random() * 2.5, 'spark');
  spawn(q.x, q.y - 22, 0, -0.8, 55, def.color, 9, 'text', def.label);
  addScore(20, q.x, q.y - 6);
  window.sfx?.('combo');
}
function drawPowerIcon(type, cx, cy, r) {                        // round badge icon; r = radius in px
  ctx.save(); ctx.translate(cx, cy); ctx.scale(r / 10, r / 10);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fillStyle = type === 'spring' ? '#16a34a' : '#ea580c'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke();
  if (type === 'spring') {                                       // coiled spring with an up arrow
    ctx.strokeStyle = '#ecfccb'; ctx.lineWidth = 1.8; ctx.beginPath();
    ctx.moveTo(-4, 6); ctx.lineTo(4, 4); ctx.lineTo(-4, 2); ctx.lineTo(4, 0); ctx.lineTo(-4, -2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(-4, -3); ctx.lineTo(4, -3); ctx.closePath(); ctx.fill();
  } else {                                                       // spiked boot
    ctx.fillStyle = '#fff7ed'; ctx.beginPath();
    ctx.moveTo(-3, -7); ctx.lineTo(2, -7); ctx.lineTo(2, 0); ctx.lineTo(7, 2); ctx.lineTo(7, 5); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#431407';
    for (const sx of [-2.5, 0.5, 3.5]) { ctx.beginPath(); ctx.moveTo(sx - 1.4, 5); ctx.lineTo(sx + 1.4, 5); ctx.lineTo(sx, 8.5); ctx.closePath(); ctx.fill(); }
  }
  ctx.restore();
}
function drawPickups() {
  for (const k of pickups) {
    const q = pickupPos(k), y = q.y - camY;
    if (y < -30 || y > H + 30) continue;
    const bob = Math.sin(elapsed * 4 + k.phase) * 3, pulse = 0.5 + 0.5 * Math.sin(elapsed * 6 + k.phase), col = POWER[k.type].color;
    const g = ctx.createRadialGradient(q.x, y + bob, 2, q.x, y + bob, 22 + pulse * 5);
    g.addColorStop(0, col + 'cc'); g.addColorStop(1, col + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, y + bob, 22 + pulse * 5, 0, Math.PI * 2); ctx.fill();
    drawPowerIcon(k.type, q.x, y + bob, 12);
  }
}
function drawAura() {                                            // soft coloured glow around the player while a powerup is active
  const p = player, cx = p.x + PW / 2, cy = p.y - camY + PH / 2, a = 0.5 + 0.2 * Math.sin(elapsed * 8);
  [['spring', '#22c55e', 34], ['grip', '#f97316', 40]].forEach(([t, col, r]) => {
    if (!(powerT[t] > 0)) return;
    const g = ctx.createRadialGradient(cx, cy, 8, cx, cy, r);
    g.addColorStop(0, col + '00'); g.addColorStop(0.7, col + '44'); g.addColorStop(1, col + '00');
    ctx.globalAlpha = a + 0.3; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  });
}
function drawPowerHUD() {                                        // icon + shrinking bar under the score; blinks in the last 2s
  let row = 0;
  for (const t of ['spring', 'grip']) {
    const left = powerT[t];
    if (!(left > 0)) continue;
    const y = 46 + row++ * 22;
    if (left < 120 && Math.floor(left / 6) % 2) continue;
    const def = POWER[t];
    drawPowerIcon(t, W - WALL - 8 - 84 - 10, y + 6, 9);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(W - WALL - 8 - 80, y, 80, 10);
    ctx.fillStyle = def.color; ctx.fillRect(W - WALL - 8 - 80, y, 80 * left / (def.secs * 60), 10);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(W - WALL - 8 - 80, y, 80, 10);
  }
}

// ---------- Enemies (from floor 50): one villain per hero flies in and fires horizontal beams ----------
// State machine: enter -> charge -> fire -> (pause -> charge -> fire) x volleys -> leave
// Everything here lives in SCREEN space (y measured from the top of the canvas), not world space.
const ENEMY_MIN_FLOOR = 50;
const ENEMY_SY = 140;          // resting screen height of the villain (upper-middle of the screen)
const BEAM_THICK = 14;         // beam thickness in px
const BEAM_LIFE = 24;          // ticks a beam stays deadly
const BEAM_SLOT = 110;         // spacing of the beam "slots"; 110 - 14 thick = 96px clear gap (>= MIN_GAP)
const MIN_GAP = 90;            // guaranteed clear vertical gap between neighbouring beams
const BEAM_COLORS = { marinara: '#f43f5e', soggy: '#60a5fa', taxman: '#4ade80', lunk: '#c084fc' };
let enemy = null;              // {state,t,age,side,x,homeX,volleys,beams:[y..],hit,chargeLen}
let enemyCd = 0, enemyIntro = false, hitFlash = 0;

function resetEnemy() { enemy = null; enemyCd = 120; enemyIntro = false; hitFlash = 0; }   // first villain after ~2s

const enemyHeight = () => Math.max(player.floor, bestFloor);
const beamCount = () => { const n = enemyHeight(); return n < 100 ? 2 : n < 170 ? 3 : 4; };   // 2 at 50, 3 by ~120, 4 by ~200
const beamColor = () => BEAM_COLORS[player.ch.id] || '#e879f9';

// Choose beam heights (screen y of each beam's centre). Slots are spaced BEAM_SLOT apart around the
// player's current height, and one of the three slots nearest the player is always left empty, so
// there is always a wide open lane right where the player is. Returns a sorted array of y values.
function pickBeamYs(count, playerSy) {
  const pc = Math.max(150, Math.min(H - 150, playerSy + PH / 2));   // keep the 3 near slots on screen
  const skip = Math.floor(Math.random() * 3) - 1;                   // -1, 0 or +1: the slot left open
  const slots = [];
  for (let k = -4; k <= 4; k++) {
    const y = pc + k * BEAM_SLOT;
    if (k !== skip && y > 50 && y < H - 30) slots.push(y);
  }
  while (slots.length > count) slots.splice(Math.floor(Math.random() * slots.length), 1);   // drop random extras
  return slots;
}

function spawnEnemy() {
  const side = Math.random() < 0.5 ? -1 : 1;                        // -1 = from the left edge, 1 = from the right
  enemy = { state: 'enter', t: 0, age: 0, side, x: side < 0 ? -30 : W + 30, homeX: side < 0 ? WALL + 50 : W - WALL - 50,
            volleys: Math.random() < 0.5 ? 1 : 2, beams: [], hit: false, chargeLen: Math.round(ramp(enemyHeight(), 50, 200, 60, 40)) };
  if (!enemyIntro) {
    enemyIntro = true;
    const name = (VILLAINS[player.ch.id] || VILLAINS.taxman).name;
    message = `${name.toUpperCase()} APPEARS!`; messageTimer = 120;
  }
}

function updateEnemy() {
  if (!enemy) {
    if (enemyHeight() >= ENEMY_MIN_FLOOR && --enemyCd <= 0) spawnEnemy();
    return;
  }
  const e = enemy;
  e.age++; e.t++;
  if (e.state === 'enter') {                                        // glide in from the edge
    e.x += (e.homeX - e.x) * 0.1;
    if (Math.abs(e.homeX - e.x) < 3) startCharge(e);
  } else if (e.state === 'charge') {
    if (e.t >= e.chargeLen) { e.state = 'fire'; e.t = 0; e.hit = false; window.sfx?.('beam'); shake = Math.max(shake, 3); }
  } else if (e.state === 'fire') {
    if (!e.hit && beamsHitPlayer(e)) hitPlayer(e);
    if (e.t >= BEAM_LIFE) endVolley(e);
  } else if (e.state === 'pause') {
    if (e.t >= 20) startCharge(e);
  } else if (e.state === 'leave') {
    e.x += e.side * 6;                                              // fly back out the way it came
    if (e.x < -40 || e.x > W + 40) { enemy = null; enemyCd = Math.round(ramp(enemyHeight(), 50, 200, 540, 270)); }   // 9s -> 4.5s
  }
}

function startCharge(e) {
  e.state = 'charge'; e.t = 0;
  e.beams = pickBeamYs(beamCount(), player.y - camY);               // locked in now, so the warning lines are exact
  window.sfx?.('warn');
}

function endVolley(e) {
  if (!e.hit) {                                                     // survived without a scratch
    const px = player.x + PW / 2, py = player.y - 20;
    addScore(50, px, py, false);
    spawn(px, py, 0, -0.8, 55, '#86efac', 8, 'text', `DODGED +${50 * multiplier()}`);
  }
  e.beams = [];
  if (--e.volleys > 0) { e.state = 'pause'; e.t = 0; } else { e.state = 'leave'; e.t = 0; }
}

// Player hitbox = sprite box shrunk by 6px on every side, tested against each beam band
function beamsHitPlayer(e) {
  const top = player.y - camY + 6, bottom = player.y - camY + PH - 6;
  const left = player.x + 6, right = player.x + PW - 6;
  if (right < WALL || left > W - WALL) return false;                // (can't happen, walls clamp the player)
  return e.beams.some(by => bottom > by - BEAM_THICK / 2 && top < by + BEAM_THICK / 2);
}

// A hit knocks the player DOWN. The camera keeps scrolling, so the lost height can end the run.
function hitPlayer(e) {
  const p = player;
  e.hit = true;
  p.vy = 10; p.y += 4; p.onGround = false; p.on = null; p.coyote = 0; jumpBuf = 0;   // y+=4 so we don't re-land on the same floor
  kickChain = 0; endCombo();                                        // chain and combo end (fire mode follows)
  shake = Math.max(shake, 8); hitFlash = 24;
  window.sfx?.('hit');
}

function drawEnemy() {
  if (!enemy) return;
  const e = enemy, color = beamColor();
  const x0 = WALL, bw = W - 2 * WALL;
  if (e.state === 'charge') {                                       // warning: a red band exactly where the beam will be, pulsing harder as it charges
    const prog = Math.min(1, e.t / e.chargeLen);
    const pulse = 0.5 + 0.5 * Math.sin(e.t * (0.3 + prog * 0.7));   // pulse speeds up toward full charge
    ctx.save();
    for (const by of e.beams) {
      ctx.fillStyle = `rgba(255,40,40,${0.15 + (0.13 + 0.12 * prog) * pulse})`;   // alpha pulses 0.15 - 0.28, peak rising to 0.4 at full charge
      ctx.fillRect(x0, by - BEAM_THICK / 2, bw, BEAM_THICK);
      ctx.strokeStyle = `rgba(255,${Math.round(110 - 60 * prog)},${Math.round(110 - 60 * prog)},${0.65 + 0.35 * pulse})`;
      ctx.lineWidth = 1.5 + prog * 1.5; ctx.setLineDash([10, 6]); ctx.lineDashOffset = -e.t * 1.5;
      ctx.beginPath(); ctx.moveTo(x0, by - BEAM_THICK / 2); ctx.lineTo(x0 + bw, by - BEAM_THICK / 2);
      ctx.moveTo(x0, by + BEAM_THICK / 2); ctx.lineTo(x0 + bw, by + BEAM_THICK / 2); ctx.stroke();
      ctx.setLineDash([]);
      for (const mx of [WALL / 2, W - WALL / 2]) {                  // "!" markers on both walls
        ctx.fillStyle = `rgba(220,30,30,${0.75 + 0.25 * pulse})`;
        ctx.beginPath(); ctx.arc(mx, by, 9 + prog * 3, 0, Math.PI * 2); ctx.fill();
        text('!', mx, by + 5, 12 + Math.round(prog * 4), '#fff');
      }
    }
    ctx.restore();
  } else if (e.state === 'fire') {                                  // glowing beam: soft halo, colour band, white flickering core
    const fade = Math.min(1, (BEAM_LIFE - e.t) / 4);
    ctx.save();
    for (const by of e.beams) {
      ctx.globalAlpha = 0.25 * fade; ctx.fillStyle = color; ctx.fillRect(x0, by - BEAM_THICK / 2 - 8, bw, BEAM_THICK + 16);
      ctx.globalAlpha = (0.85 + Math.random() * 0.15) * fade; ctx.fillRect(x0, by - BEAM_THICK / 2, bw, BEAM_THICK);
      ctx.fillStyle = '#fff'; ctx.fillRect(x0, by - (3 + Math.random() * 2), bw, 6 + Math.random() * 3);
    }
    ctx.restore();
  }
  const firing = e.state === 'charge' ? e.t / e.chargeLen : e.state === 'fire' ? 1 : 0;
  const facing = player.x + PW / 2 < e.x ? 1 : -1;                  // art faces LEFT at facing=1
  drawVillainArt(player.ch.id, e.x, ENEMY_SY + Math.sin(e.age * 0.08) * 6, facing, e.age / 30, firing);
}

// ---------- Scoring, fire mode, particles ----------
// x2 while on fire, x3 when the chain/combo gets really long. Applied to ALL points earned.
function multiplier() {
  if (kickChain < 3 && combo < 10) return 1;
  return kickChain >= 6 || combo >= 20 ? 3 : 2;
}
function addScore(base, x, y, popup = true) {
  const m = multiplier(), pts = base * m;
  score += pts;
  if (popup) spawn(x, y, 0, -0.8, 55, m > 1 ? '#fb923c' : '#fde047', 9, 'text', `+${pts}`);
}
function spawn(x, y, vx, vy, life, color, size, type, str) {
  if (particles.length >= MAX_PARTICLES) return;
  particles.push({ x, y, vx, vy, life, max: life, color, size, type, text: str, rot: Math.random() * 6 });
}
function updateParticles() {
  let j = 0;
  for (const q of particles) {
    q.x += q.vx; q.y += q.vy;
    if (q.type === 'confetti') { q.vy += 0.15; q.vx *= 0.98; q.x += Math.sin(q.life * 0.3 + q.rot) * 0.6; }
    else if (q.type === 'spark') q.vy += 0.2;
    else if (q.type === 'dust') { q.vx *= 0.92; q.vy *= 0.92; }
    else if (q.type === 'flame') { q.vx *= 0.95; q.vy -= 0.03; }
    if (--q.life > 0) particles[j++] = q;
  }
  particles.length = j;
}
function landFx(y, impact) {                     // dust puffs, bigger for harder landings
  const p = player, n = Math.min(12, 2 + Math.floor(impact / 2));
  for (let i = 0; i < n; i++) {
    const dir = i % 2 ? 1 : -1;
    spawn(p.x + PW / 2 + (Math.random() - 0.5) * PW, y, dir * (0.5 + Math.random() * 1.5) * (1 + impact * 0.08), -Math.random() * (0.5 + impact * 0.08), 22 + Math.random() * 12, '#e6f4ff', 2 + Math.random() * 2 + impact * 0.12, 'dust');
  }
  if (impact > 4) window.sfx?.('land');
}
function wallKickJump() {
  const p = player;
  kickChain++;
  addScore(25 * kickChain, p.x + PW / 2, p.y - 10);
  message = kickChain > 1 ? `WALL KICK x${kickChain}!` : 'WALL KICK!'; messageTimer = 45;
  shake = Math.max(shake, 4);
  const wx = p.x + PW / 2 < W / 2 ? WALL : W - WALL;
  for (let i = 0; i < 12; i++) spawn(wx, p.y + PH / 2 + (Math.random() - 0.5) * 24, (p.x + PW / 2 < W / 2 ? 1 : -1) * Math.random() * 4, (Math.random() - 0.8) * 4, 16 + Math.random() * 10, i % 2 ? '#fde047' : '#fff', 2 + Math.random() * 2, 'spark');
  window.sfx?.('wallkick');
}
function updateFire() {                          // on fire while chain >= 3 OR combo >= 10; ends when both are false
  const on = kickChain >= 3 || combo >= 10;
  if (on && !fire) {
    fire = true; fireMsgTimer = 90; shake = Math.max(shake, 5);
    const p = player;
    for (let i = 0; i < 40; i++) spawn(p.x + PW / 2, p.y + PH / 2, (Math.random() - 0.5) * 9, -2 - Math.random() * 6, 50 + Math.random() * 30, ['#ef4444', '#fde047', '#4ade80', '#60a5fa', '#f472b6'][i % 5], 3 + Math.random() * 3, 'confetti');
    window.sfx?.('fireOn');
  } else if (!on && fire) {
    fire = false;
    window.sfx?.('fireOff');
  }
}

const comboDuration = () => (perkOf(player.ch) === 'snack' ? 270 : 180);   // ticks

function landOn(n, fresh) {
  const p = player;
  // Measure from your highest floor so far, so dropping down and re-climbing old floors can't farm combos
  const gained = n - Math.max(lastFloor, bestFloor);
  if (gained >= 2) {                          // multi-floor jumps build a combo
    combo += gained;
    comboTimer = comboDuration();             // 3 seconds to keep it going (4.5 with the snack perk)
  } else if (gained !== 0) {
    endCombo();
  }
  lastFloor = n;
  p.floor = n;
  if (n > bestFloor) { addScore((n - bestFloor) * 10, p.x + PW / 2, p.y - 6, n - bestFloor >= 2); bestFloor = n; }
  if (fresh && gained < 2) kickChain = 0;     // a normal small hop breaks the wall-kick chain
}

function endCombo() {
  if (combo >= 4) {
    addScore(combo * combo * 2, player.x + PW / 2, player.y - 28);
    message = combo >= 20 ? `SICK! ${combo} floor combo` : combo >= 10 ? `GREAT! ${combo} floor combo` : `Nice: ${combo} floor combo`;
    messageTimer = 120;
    window.sfx?.('combo');
  }
  combo = 0; comboTimer = 0;
}

function gameOver() {
  endCombo();
  fire = false; shake = 0;
  mode = 'over'; overAt = now();
  touches.clear(); recalcTouches();
  window.sfx?.('gameover');
  window.music?.stop();
  lastGain = score; wallet += score; saveWallet();   // bank this run's points
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('slipup-high', String(highScore)); } catch (e) {}
  }
  track('run_ended', { character: player.ch.name, floor: bestFloor, score, seconds: Math.round(elapsed) });
  askCoach();
}
// Analytics helper: never let a blocked/failed PostHog break the game.
function track(event, props) {
  try { window.posthog && posthog.capture(event, props); } catch (e) {}
}

// The one AI/API call: ask the local server (server.js) for a one-line taunt + tip.
// Where there is no server (e.g. GitHub Pages) the request 404s and we simply show nothing.
let coachLine = '';
let coachSeq = 0;   // lets us ignore a reply that belongs to an older run
async function askCoach() {
  const mySeq = ++coachSeq;
  const payload = { character: player.ch.name, floor: bestFloor, score, best: highScore };
  track('coach_requested', { floor: bestFloor });
  const t0 = performance.now();
  try {
    const r = await fetch('/api/coach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) throw new Error('status ' + r.status);
    const j = await r.json();
    if (mode !== 'over' || mySeq !== coachSeq) return;   // stale reply from an earlier run: drop it
    coachLine = j.line;
    track('coach_received', { ms: Math.round(performance.now() - t0), tokens_out: j.usage && j.usage.output_tokens });
  } catch (e) {
    track('coach_failed', { reason: String(e.message).slice(0, 60) });
  }
}

function wrapText(str, maxChars) {
  const lines = []; let cur = '';
  for (const w of str.split(' ')) {
    if ((cur + ' ' + w).trim().length > maxChars) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
  }
  if (cur) lines.push(cur);
  return lines;
}


// ---------- Drawing ----------
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function drawBackground(offset, glow = 0) {   // glow 0..1 warms the sky while on fire
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${mix([30, 58, 95], [96, 44, 52], glow)})`); g.addColorStop(1, `rgb(${mix([74, 122, 176], [196, 112, 84], glow)})`);
  ctx.fillStyle = g; ctx.fillRect(-12, -12, W + 24, H + 24);
  // background bricks scroll slower than the floors (parallax)
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  const bh = 24, shift = ((-offset * 0.5) % bh + bh) % bh;
  for (let y = -bh + shift; y < H; y += bh) {
    const row = Math.floor((y - shift - offset * 0.5) / bh);
    for (let x = (row % 2 ? 0 : -24); x < W; x += 48) ctx.strokeRect(x, y, 48, bh);
  }
}

function drawWalls() {
  ctx.fillStyle = '#9fd3f5';
  ctx.fillRect(0, -12, WALL, H + 24); ctx.fillRect(W - WALL, -12, WALL, H + 24);
  ctx.fillStyle = '#dff3ff';
  ctx.fillRect(WALL - 6, -12, 6, H + 24); ctx.fillRect(W - WALL, -12, 6, H + 24);
}

function drawFloors() {
  for (const f of floors) {
    const y = f.y - camY;
    if (y < -40 || y > H + 40) continue;
    if (f.slant) { drawSlantFloor(f, y); continue; }
    ctx.fillStyle = f.n % 50 === 0 ? '#fbbf24' : f.moving ? '#fdba74' : '#bfe6ff';   // moving floors are orange ice
    ctx.fillRect(f.x, y, f.w, 14);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(f.x, y, f.w, 3);               // icy shine on top
    ctx.fillStyle = f.moving ? '#c2410c' : '#5b8db8';
    ctx.fillRect(f.x, y + 14, f.w, 3);
    if (f.moving) drawChevrons(f, y);
    if (f.n % 10 === 0) {
      ctx.fillStyle = '#0b1020'; ctx.font = `8px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(f.n, f.x + f.w / 2, y + 11);
    }
  }
}

// A tilted ramp: icy blue slab rotated about its centre, yellow/black hazard stripes along the underside
function drawSlantFloor(f, y) {
  ctx.save();
  ctx.translate(f.x + f.w / 2, y); ctx.rotate(f.slant); ctx.translate(-f.w / 2, 0);
  ctx.fillStyle = '#9fd8ff'; ctx.fillRect(0, 0, f.w, 14);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(0, 0, f.w, 3);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 14, f.w, 6); ctx.clip();
  ctx.fillStyle = '#facc15'; ctx.fillRect(0, 14, f.w, 6);
  ctx.fillStyle = '#111827';
  for (let sx = -6; sx < f.w; sx += 12) { ctx.beginPath(); ctx.moveTo(sx, 14); ctx.lineTo(sx + 6, 14); ctx.lineTo(sx + 12, 20); ctx.lineTo(sx + 6, 20); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  if (f.n % 10 === 0) { ctx.fillStyle = '#0b1020'; ctx.font = `8px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(f.n, f.w / 2, 11); }
  ctx.restore();
}

// Little arrows on a moving floor pointing the way it is currently sliding, plus end rivets
function drawChevrons(f, y) {
  const dir = f.dx < 0 ? -1 : 1;
  ctx.fillStyle = '#9a3412';
  for (let cx = f.x + 14; cx < f.x + f.w - 8; cx += 18) {
    ctx.beginPath();
    ctx.moveTo(cx - 3 * dir, y + 4); ctx.lineTo(cx + 3 * dir, y + 8); ctx.lineTo(cx - 3 * dir, y + 12);
    ctx.lineTo(cx - 5 * dir, y + 12); ctx.lineTo(cx + dir, y + 8); ctx.lineTo(cx - 5 * dir, y + 4);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#7c2d12';
  ctx.fillRect(f.x + 2, y + 6, 3, 3); ctx.fillRect(f.x + f.w - 5, y + 6, 3, 3);   // rivets
}

function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  const tw = ctx.measureText(str).width;          // safety net: shrink anything wider than the space between the walls
  if (tw > W - 2 * WALL) ctx.font = `${Math.max(6, Math.floor(size * (W - 2 * WALL) / tw))}px ${FONT}`;
  ctx.fillStyle = '#0b1020'; ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawHUD() {
  const flick = ['#fb923c', '#fde047', '#f97316', '#facc15'][Math.floor(performance.now() / 70) % 4];
  text(`FLOOR ${player.floor}`, WALL + 8, 26, 10, '#fff', 'left');
  text(`SCORE ${score}`, W - WALL - 8, 26, 10, fire ? flick : '#fde047', 'right');
  drawPowerHUD();
  if (combo >= 2) {
    text(`COMBO x${combo}`, W / 2, 56, 11, '#f472b6');
    ctx.fillStyle = '#f472b6'; ctx.fillRect(W / 2 - 50, 64, 100 * comboTimer / comboDuration(), 5);
  }
  if (fire) text(`ON FIRE x${multiplier()}`, W / 2, 90, 13, flick);
  if (kickChain >= 2) text(`KICK CHAIN ${kickChain}`, W / 2, 108, 8, '#fde047');
  if (fireMsgTimer > 0) text('ON FIRE!', W / 2, H / 2 - 70 - (90 - fireMsgTimer) * 0.3, 22, flick);
  if (messageTimer > 0) text(message, W / 2, H / 2 - 120, 13, '#fde047');
  if (isTouch) drawTouchHints();
  if (elapsed < 5) {
    const hint = !isTouch ? 'Run, then jump. Faster run = higher jump.' : controlMode === 'tilt' ? 'TILT TO MOVE · TAP TO JUMP' : 'HOLD LEFT / RIGHT · TAP MIDDLE TO JUMP';
    text(hint, W / 2, H - 30, 8);
  }
}

// Touch devices only: faint on-screen hints. TOUCH mode = left / right arrow zones (light up while held); TILT mode = a tilting phone icon at run start.
function drawTouchHints() {
  ctx.save();
  if (controlMode === 'touch') {
    for (const [zx, dir, on] of [[0, -1, touchLeft], [W * 2 / 3, 1, touchRight]]) {
      ctx.fillStyle = on ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.06)';
      ctx.fillRect(zx, H - 78, W / 3, 78);
      ctx.fillStyle = on ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.28)';
      const cx = zx + W / 6, cy = H - 46;
      ctx.beginPath(); ctx.moveTo(cx + 14 * dir, cy); ctx.lineTo(cx - 10 * dir, cy - 16); ctx.lineTo(cx - 10 * dir, cy + 16); ctx.closePath(); ctx.fill();
    }
  } else if (elapsed < 5) {
    ctx.translate(W / 2, H - 74); ctx.rotate(Math.sin(elapsed * 4) * 0.35);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(-9, -15, 18, 30, 3); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawPadlock(cx, cy) {                    // small padlock drawn with shapes (the pixel font has no lock glyph)
  ctx.save();
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy - 4, 5, Math.PI, 0); ctx.stroke();   // shackle
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(cx - 7, cy - 4, 14, 11);     // body
  ctx.fillStyle = '#78350f'; ctx.fillRect(cx - 1, cy, 2, 4);           // keyhole
  ctx.restore();
}

function drawStatBars(ch, x, y) {                 // label on the left, 8 filled/empty segments on the right
  STAT_ROWS.forEach((r, i) => {
    const ry = y + i * 20, n = statSegments(r, ch);
    text(r.label, x, ry, 8, '#93c5fd', 'left');
    for (let k = 0; k < 8; k++) {
      ctx.fillStyle = k < n ? '#fde047' : 'rgba(255,255,255,0.15)';
      ctx.fillRect(x + 80 + k * 28, ry - 9, 24, 10);
    }
  });
}

function drawThumbs() {                           // 2 rows of 6 small sprites; selected one gets a box
  CHARACTERS.forEach((ch, i) => {
    const x = 60 + (i % 6) * 60 + 12, y = 384 + Math.floor(i / 6) * 62;
    const locked = !isUnlocked(i);
    ctx.save();
    if (locked) ctx.globalAlpha = 0.3;
    drawSprite(ch, x, y, 1, 0, 1, 0, false, 0);
    ctx.restore();
    if (locked) {
      drawPadlock(x + PW / 2, y + 26);
      text(String(PRICES[i]), x + PW / 2, y + 62, 8, wallet >= PRICES[i] ? '#86efac' : '#fca5a5');
    }
    if (i === selected) { ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2; ctx.strokeRect(x - 7, y - 7, PW + 14, 64); }
  });
}

// A rounded button for menu / end-card taps. `r` is the same hit box the tap handler uses.
function drawButton(r, label, color, size, sub) {
  const [x, y, w, h] = r;
  ctx.save();
  ctx.fillStyle = color; ctx.globalAlpha *= 0.92; ctx.beginPath(); ctx.roundRect(x, y + 3, w, h - 3, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.roundRect(x, y, w, (h - 3) / 2, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x + 1, y + 1, w - 2, h - 2, 10); ctx.stroke();
  ctx.restore();
  const cy = y + h / 2 + size / 2 - (sub ? 5 : 0);
  text(label, x + w / 2, cy, size, '#fff');
  if (sub) text(sub, x + w / 2, cy + 15, 6, '#cbd5e1');
}

function drawSelect() {
  drawBackground(0); drawWalls();
  ctx.save(); ctx.translate(0, menuOY());
  text('MOUNT NEVEREST', W / 2, 50, 20, '#e0f2fe');
  const ch = CHARACTERS[selected];
  ctx.save();
  if (needFlash > 0) ctx.translate(Math.sin(needFlash * 1.5) * 4, 0);   // shake when you can't afford it
  ctx.save(); ctx.translate(W / 2 - PW, 100); ctx.scale(2, 2);
  drawSprite(ch, 0, 0, 1, 0, 1, performance.now() / 120, false, 6);
  ctx.restore();
  text(`<  ${ch.name}  >`, W / 2, 222, 13, '#fde047');
  text(`"${ch.bio}"`, W / 2, 244, 8, '#e2e8f0');
  text(`PERK: ${ch.perk.label}`, W / 2, 264, 8, '#f472b6');
  drawStatBars(ch, 90, 292);
  ctx.restore();
  if (needFlash > 0) { needFlash--; text(`NEED ${needPrice} PTS`, W / 2, 372, 10, '#f87171'); }
  else if (!isUnlocked(selected)) text(`LOCKED: ${PRICES[selected]} PTS`, W / 2, 372, 10, '#fbbf24');
  const pulseA = 0.5 + 0.4 * Math.sin(now() / 300);               // big tappable < > on both sides of the sprite
  text('<', 52, 168, 34, `rgba(253,224,71,${pulseA})`); text('>', W - 52, 168, 34, `rgba(253,224,71,${pulseA})`);
  drawThumbs();
  if (isTouch) {
    drawButton(R.start, isUnlocked(selected) ? 'TAP TO START' : 'TAP TO BUY', '#16a34a', 12);
    drawButton(R.ctrl, `CONTROLS: ${controlMode.toUpperCase()}`, '#334155', 9, 'tap to switch');
    text('Playtest: anonymous play stats + replay recorded', W / 2, 624, 6, '#64748b');
    text(`best: ${highScore}`, W / 2, 636, 7, '#fde047');
  } else {
    text(isUnlocked(selected) ? '< > pick   ENTER start' : '< > pick   ENTER buy', W / 2, 526, 9);
    text('arrows / WASD move · SPACE jump', W / 2, 546, 8, '#cbd5e1');
    text('tip: jump right after a wall bounce = WALL KICK', W / 2, 564, 7, '#f472b6');
    text(`best: ${highScore} · wallet: ${wallet}`, W / 2, 584, 8, '#fde047');
    text('M: mute', W / 2, 602, 8, '#94a3b8');
    text('Playtest: anonymous play stats + replay recorded', W / 2, 622, 7, '#64748b');
  }
  ctx.restore();
}

function drawParticles(textPass) {
  for (const q of particles) {
    if ((q.type === 'text') !== textPass) continue;
    const x = q.x, y = q.y - camY;
    if (y < -20 || y > H + 20) continue;
    ctx.globalAlpha = Math.min(1, q.life / q.max * 1.5);
    if (textPass) { text(q.text, x, y, q.size, q.color); continue; }
    const r = q.size * (q.type === 'flame' ? q.life / q.max + 0.3 : q.type === 'dust' ? 1 + (1 - q.life / q.max) * 0.8 : 1);
    ctx.fillStyle = q.color;
    if (q.type === 'confetti' || q.type === 'spark') ctx.fillRect(x - r / 2, y - r / 2, r, r);
    else { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function drawPlay() {
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
  drawBackground(camY, fireGlow);
  drawFloors();
  drawWalls();
  drawPickups();
  drawParticles(false);                         // dust, flames, sparks, confetti sit behind the player
  drawAura();
  drawSprite(player.ch, player.x, player.y - camY, player.facing, player.angle, player.squash, player.anim, !player.onGround, Math.abs(player.vx));
  drawEnemy();                                  // beams, warning lines and the villain (screen space)
  drawParticles(true);                          // floating score popups on top
  ctx.restore();
  if (hitFlash > 0) { ctx.fillStyle = `rgba(239,68,68,${hitFlash / 24})`; ctx.fillRect(0, 0, W, H); }   // red flash when hit
  drawHUD();
}

function drawOver() {
  drawPlay();
  ctx.fillStyle = 'rgba(11,16,32,0.75)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(0, menuOY());
  text('YOU SLIPPED', W / 2, 220, 24, '#f87171');
  text(player.ch.name, W / 2, 250, 11, '#93c5fd');
  text(`floor ${bestFloor} · score ${score}`, W / 2, 285, 12);
  text(`best ${highScore}`, W / 2, 313, 10, '#fde047');
  if (coachLine) wrapText(coachLine, 40).slice(0, 3).forEach((ln, i) => text(ln, W / 2, 334 + i * 13, 8, '#a7f3d0'));
  text(isTouch ? 'TAP ANYWHERE TO RETRY' : 'R retry · C change character', W / 2, 380, 9);
  drawButton(R.change, 'CHANGE CHARACTER', '#334155', 9);
  ctx.restore();
}

// ---------- Main loop: fixed-step physics, draw every frame ----------
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (acc >= STEP) {
    if (mode === 'play') update();
    acc -= STEP;
  }
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);   // draw in 480-wide game units whatever the real canvas size is
  if (mode === 'select') drawSelect();
  else if (mode === 'play') drawPlay();
  else drawOver();
  requestAnimationFrame(frame);
}

// Fit the canvas: as tall as the screen allows (width is always 480 game units), then the largest box that fits, centred, with a backing store at the device pixel ratio (stays sharp)
function fit() {
  const vv = window.visualViewport;
  const vw = (vv && vv.width) || window.innerWidth || W, vh = (vv && vv.height) || window.innerHeight || H;
  const oldH = H;
  H = Math.round(Math.max(BASE_H, Math.min(1100, W * vh / vw)));   // taller than 3:4 screen -> taller game, no letterbox bars
  if (mode === 'play' && H !== oldH) camY += oldH - H;           // mid-run resize (Safari toolbar, rotation): keep the bottom edge put so you don't 'fall off'
  const k = Math.min(vw / W, vh / H);
  const cssW = Math.max(1, Math.floor(W * k)), cssH = Math.max(1, Math.floor(H * k));
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  viewScale = Math.min(3, Math.max(1, (window.devicePixelRatio || 1) * cssW / W));   // backing pixels per game pixel
  const bw = Math.round(W * viewScale), bh = Math.round(H * viewScale);
  if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
}
fit();
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 150));
try { window.visualViewport.addEventListener('resize', fit); } catch (e) {}

requestAnimationFrame(frame);
window.music?.start('menu');                    // menu music (audio.js waits for a user gesture)
</script>
</body>
</html>
