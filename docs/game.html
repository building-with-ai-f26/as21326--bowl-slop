<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mount Neverest · Tower Climber Prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Segoe UI", sans-serif; }
  canvas { image-rendering: pixelated; max-height: 100vh; max-width: 100vw; border: 2px solid #2b3a67; }
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<script>
// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const WALL = 32;              // thickness of the side walls
const FLOOR_GAP = 90;         // vertical distance between floors
const STEP = 1 / 60;          // physics runs at a fixed 60 ticks/sec
const SPEED_LIMIT = 40;       // safety ceiling only (~4.5x a normal run): without it, wall-to-wall bouncing grows speed to Infinity and crashes the game

// ---------- Parody characters (vector art drawn with canvas shapes) ----------
// Each character draws itself inside a 36x48 box, facing right, feet at the bottom.
// `t` is the run-animation phase, `air` is true while jumping.
const PW = 36, PH = 48;
const OUTLINE = '#1a1a2e';

function shape(fill, build) {
  ctx.beginPath(); build(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
}
const ellipse = (x, y, rx, ry, fill, rot = 0) => shape(fill, () => ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2));
const circle = (x, y, r, fill) => ellipse(x, y, r, r, fill);
const box = (x, y, w, h, r, fill) => shape(fill, () => ctx.roundRect(x, y, w, h, r));
const shine = (x0, y0, x1, y1, light, dark) => {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, light); g.addColorStop(1, dark);
  return g;
};
function eye(x, y, r, lookX = 0.4, lookY = 0) {
  ctx.lineWidth = 1;
  ellipse(x, y, r * 0.75, r, '#fff');
  ctx.beginPath(); ctx.arc(x + lookX * r * 0.4, y + lookY * r * 0.4, r * 0.45, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill();
  ctx.beginPath(); ctx.arc(x + lookX * r * 0.4 + r * 0.15, y + lookY * r * 0.4 - r * 0.2, r * 0.15, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 1.5;
}
// two legs that swing while running and tuck while jumping
function legs(t, air, hipY, drawLeg) {
  const swing = air ? 0 : Math.sin(t) * 4;
  const lift = air ? -4 : 0;
  drawLeg(13 - swing, hipY, 46 + lift + Math.max(0, -Math.sin(t)) * -2);
  drawLeg(23 + swing, hipY, 46 + lift + Math.max(0, Math.sin(t)) * -2);
}

const CHARACTERS = [
  {
    name: 'Super Marinara',
    bio: "It's-a me, a pasta.",
    stats: { accel: 0.45, jump: 11, grip: 0.97 },
    draw(t, air) {
      legs(t, air, 38, (x, hip, foot) => {
        box(x - 3, hip, 6, foot - hip - 2, 2, '#1d4ed8');
        ellipse(x + 2, foot - 1, 5, 3, '#4a2c12');
      });
      // spaghetti hair hanging out the back
      ctx.save(); ctx.strokeStyle = '#e9c46a'; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(12 + i, 12);
        ctx.quadraticCurveTo(5 + i * 2, 18 + i * 2, 9 + i, 26 + i * 2 + Math.sin(t + i) * 1.5);
        ctx.stroke();
      }
      ctx.restore();
      ellipse(18, 32, 11, 8, shine(0, 24, 0, 40, '#ef4444', '#991b1b'));          // red shirt
      box(11, 28, 14, 12, 3, shine(0, 28, 0, 40, '#3b82f6', '#1e3a8a'));         // overalls bib
      circle(13.5, 31, 1.5, '#facc15'); circle(22.5, 31, 1.5, '#facc15');
      // fork arm
      ctx.save(); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(31, 36); ctx.lineTo(34, 18); ctx.stroke();
      for (const dx of [-1.5, 0, 1.5]) { ctx.beginPath(); ctx.moveTo(34 + dx, 18); ctx.lineTo(34.5 + dx, 13); ctx.stroke(); }
      ctx.restore();
      ellipse(28, 33, 4, 3, '#ef4444', -0.5); circle(31, 31, 2.8, '#fff');
      // head
      circle(19, 17, 9, shine(10, 8, 28, 26, '#fcd9a8', '#e0a96d'));
      ellipse(27, 19, 4, 3.2, '#f4a582');                                         // big nose
      ellipse(22, 23, 4, 2, '#4a2c12'); ellipse(28, 22.5, 4, 2, '#4a2c12');       // mustache
      eye(22, 14, 3);
      // colander hat
      shape(shine(10, 2, 28, 12, '#f1f5f9', '#94a3b8'), () => { ctx.arc(19, 11, 10, Math.PI, 0); ctx.closePath(); });
      ctx.fillStyle = '#334155';
      for (const [hx, hy] of [[14, 7], [19, 5], [24, 7], [16.5, 9.5], [21.5, 9.5]]) { ctx.beginPath(); ctx.arc(hx, hy, 0.9, 0, Math.PI * 2); ctx.fill(); }
      box(6, 10, 26, 3, 1.5, '#cbd5e1');
      ellipse(5, 11.5, 2.5, 1.8, '#94a3b8'); ellipse(33, 11.5, 2.5, 1.8, '#94a3b8');
    },
  },
  {
    name: 'Soggy the Hedgehog',
    bio: 'Gotta go... eventually.',
    stats: { accel: 0.5, jump: 10.5, grip: 0.985 },
    draw(t, air) {
      legs(t, air, 36, (x, hip, foot) => {
        box(x - 1.5, hip, 3, foot - hip - 2, 1.5, '#1e40af');
        ellipse(x + 2, foot - 1.5, 6, 3.2, shine(0, foot - 4, 0, foot, '#f87171', '#b91c1c'));
        ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, foot - 4); ctx.lineTo(x + 2, foot); ctx.stroke(); ctx.restore();
      });
      // droopy, waterlogged spines
      const blue = shine(0, 6, 0, 40, '#3b82f6', '#1e3a8a');
      for (const [tx, ty] of [[1, 30], [3, 24], [4, 17]]) {
        shape(blue, () => { ctx.moveTo(14, 10); ctx.quadraticCurveTo(tx - 2, ty - 8, tx, ty); ctx.lineTo(16, 22); ctx.closePath(); });
      }
      ellipse(17, 32, 8, 8, blue);
      ellipse(19, 33, 5, 5.5, '#fcd9a8');                                          // belly
      ellipse(27, 31, 4.5, 1.8, '#fcd9a8', 0.4); circle(30, 33, 2.5, '#fff');      // limp arm
      circle(19, 17, 10, blue);
      ellipse(25, 21, 6, 4, '#fcd9a8');                                            // muzzle
      circle(30.5, 19, 1.8, '#111');
      ctx.save(); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(26, 24.5, 2.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); ctx.restore(); // frown
      eye(23.5, 13.5, 4, 0.4, 0.6);
      // heavy eyelid makes him look sad
      shape('#2563eb', () => { ctx.ellipse(23.5, 13.5, 3.3, 4.3, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); });
      // tiny personal rain cloud, with drops that fall on a loop
      ctx.save(); ctx.lineWidth = 1;
      ellipse(15, -6, 5, 3, '#94a3b8'); ellipse(21, -7, 6, 4, '#94a3b8'); ellipse(26, -5, 4, 3, '#94a3b8');
      ctx.fillStyle = '#67e8f9';
      for (let i = 0; i < 3; i++) {
        const dy = ((t * 6 + i * 7) % 14);
        ctx.beginPath(); ctx.ellipse(15 + i * 5, -2 + dy, 0.9, 1.6, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    },
  },
  {
    name: 'Tax-Man',
    bio: 'Wakka wakka. You owe 30%.',
    stats: { accel: 0.38, jump: 12.5, grip: 0.97 },
    draw(t, air) {
      legs(t, air, 38, (x, hip, foot) => {
        ctx.save(); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x, hip); ctx.lineTo(x, foot - 2); ctx.stroke(); ctx.restore();
        ellipse(x + 2.5, foot - 1.5, 4.5, 2.2, '#111');
      });
      // receipt tape spilling from the mouth
      ctx.save(); ctx.lineWidth = 1;
      box(29, 22 + Math.sin(t) * 1.5, 7, 12, 1, '#f8fafc');
      ctx.strokeStyle = '#94a3b8';
      for (let ly = 25; ly < 33; ly += 2.5) { ctx.beginPath(); ctx.moveTo(30.5, ly + Math.sin(t) * 1.5); ctx.lineTo(34.5, ly + Math.sin(t) * 1.5); ctx.stroke(); }
      ctx.restore();
      // chomping body: the mouth opens and closes as he runs
      const open = air ? 0.55 : 0.15 + Math.abs(Math.sin(t)) * 0.4;
      shape(shine(6, 10, 30, 42, '#fde047', '#ca8a04'), () => { ctx.moveTo(18, 26); ctx.arc(18, 26, 15, open, Math.PI * 2 - open); ctx.closePath(); });
      shape('#dc2626', () => { ctx.moveTo(15, 38); ctx.lineTo(19, 38); ctx.lineTo(18.5, 44); ctx.lineTo(17, 46); ctx.lineTo(15.5, 44); ctx.closePath(); }); // necktie
      eye(19, 18, 3);
      ctx.save(); ctx.lineWidth = 1.2; ctx.strokeStyle = '#78350f';
      ctx.beginPath(); ctx.arc(19.5, 18, 4.5, 0, Math.PI * 2); ctx.stroke();            // reading glasses
      ctx.beginPath(); ctx.moveTo(15, 18); ctx.lineTo(8, 16); ctx.stroke();
      ctx.restore();
      // green accountant's visor
      ctx.save(); ctx.globalAlpha = 0.85;
      shape(shine(0, 6, 0, 14, '#4ade80', '#15803d'), () => { ctx.moveTo(5, 13); ctx.quadraticCurveTo(16, 4, 27, 9); ctx.lineTo(35, 13); ctx.lineTo(25, 14); ctx.quadraticCurveTo(15, 11, 5, 15); ctx.closePath(); });
      ctx.restore();
    },
  },
  {
    name: 'Lunk',
    bio: 'Dangerous to go alone. Take this bread.',
    stats: { accel: 0.42, jump: 11.5, grip: 0.96 },
    draw(t, air) {
      legs(t, air, 38, (x, hip, foot) => {
        box(x - 2.5, hip, 5, foot - hip - 4, 2, '#f5e6c8');
        box(x - 3, foot - 7, 7, 7, 2, '#78350f');
      });
      // floppy cap tail behind the head
      shape(shine(0, 4, 0, 28, '#4ade80', '#15803d'), () => { ctx.moveTo(12, 8); ctx.quadraticCurveTo(0, 12, 2, 28 + Math.sin(t) * 2); ctx.quadraticCurveTo(8, 18, 14, 16); ctx.closePath(); });
      // tunic, belt, buckle
      shape(shine(0, 24, 0, 42, '#22c55e', '#166534'), () => { ctx.moveTo(11, 25); ctx.lineTo(25, 25); ctx.lineTo(28, 41); ctx.lineTo(8, 41); ctx.closePath(); });
      box(9, 32, 18, 3, 1, '#78350f'); box(16, 31.5, 4, 4, 1, '#facc15');
      // baguette held up like a legendary sword
      ctx.save(); ctx.translate(29, 31); ctx.rotate(0.5 + (air ? 0.4 : Math.sin(t) * 0.1));
      box(-2.5, -24, 5, 26, 2.5, shine(-3, 0, 3, 0, '#e9b872', '#b07936'));
      ctx.strokeStyle = '#7c4a1e'; ctx.lineWidth = 1;
      for (let s = -20; s < 0; s += 5) { ctx.beginPath(); ctx.moveTo(-1.5, s); ctx.lineTo(1.5, s + 2.5); ctx.stroke(); }
      ctx.restore();
      circle(28, 31, 2.8, '#fcd9a8');                                              // hand
      // head, pointy ear, hair
      shape('#fcd9a8', () => { ctx.moveTo(11, 15); ctx.lineTo(4, 11); ctx.lineTo(12, 19); ctx.closePath(); });
      circle(18, 17, 8.5, shine(10, 8, 26, 26, '#fde4c3', '#e0a96d'));
      shape('#fde047', () => { ctx.moveTo(10, 14); ctx.quadraticCurveTo(18, 7, 27, 14); ctx.lineTo(24, 12); ctx.lineTo(22, 15); ctx.lineTo(19, 12); ctx.lineTo(16, 15); ctx.closePath(); });
      eye(17.5, 17, 2.6, -0.6, 0.2); eye(23, 17, 2.6, 0.8, -0.3);                  // eyes pointing two ways
      ctx.save(); ctx.lineWidth = 1; ellipse(21, 22.5, 1.8, 1.4, '#7f1d1d'); ctx.restore();  // open mouth
      // cap
      shape(shine(0, 3, 0, 12, '#4ade80', '#15803d'), () => { ctx.moveTo(9, 13); ctx.quadraticCurveTo(18, 0, 27, 12); ctx.quadraticCurveTo(18, 8, 9, 13); ctx.closePath(); });
    },
  },
];

function drawSprite(ch, x, y, facing, angle = 0, squash = 1, t = 0, air = false) {
  ctx.save();
  ctx.translate(x + PW / 2, y + PH);           // pivot at the feet
  ctx.rotate(angle);
  ctx.scale(facing, squash);
  ctx.translate(-PW / 2, -PH);
  ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = OUTLINE;
  ch.draw(t, air);
  ctx.restore();
}

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  onKeyPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
// If the window loses focus mid-press, the keyup never arrives, so forget every held key
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const left = () => keys.ArrowLeft || keys.KeyA;
const right = () => keys.ArrowRight || keys.KeyD;
const jumpHeld = () => keys.Space || keys.ArrowUp || keys.KeyW;

// ---------- Game state ----------
let mode = 'select';             // 'select' | 'play' | 'over'
let selected = 0;
let player, floors, camY, scrollSpeed, elapsed, score, bestFloor, combo, comboTimer, lastFloor, message, messageTimer;
let highScore = 0;
try { highScore = Number(localStorage.getItem('slipup-high')) || 0; } catch (e) {}

function makeFloor(n) {
  const y = -n * FLOOR_GAP;
  if (n === 0 || n % 50 === 0) return { n, y, x: WALL, w: W - 2 * WALL };   // full-width checkpoint floors
  const maxW = Math.max(70, 220 - n * 1.2);   // floors get narrower as you climb
  const w = 70 + Math.random() * (maxW - 70);
  const x = WALL + Math.random() * (W - 2 * WALL - w);
  return { n, y, x, w };
}

function startGame() {
  const ch = CHARACTERS[selected];
  player = { ch, x: W / 2 - PW / 2, y: -PH, vx: 0, vy: 0, onGround: true, facing: 1, angle: 0, squash: 1, floor: 0, anim: 0, wallKick: 0 };
  floors = [];
  for (let n = 0; n < 12; n++) floors.push(makeFloor(n));
  camY = -H + 60;               // camera top edge, in world coordinates (up is negative y)
  scrollSpeed = 0;
  elapsed = 0; score = 0; bestFloor = 0; combo = 0; comboTimer = 0; lastFloor = 0;
  message = ''; messageTimer = 0;
  mode = 'play';
}

function onKeyPress(code) {
  if (mode === 'select') {
    if (code === 'ArrowLeft' || code === 'KeyA') selected = (selected + CHARACTERS.length - 1) % CHARACTERS.length;
    if (code === 'ArrowRight' || code === 'KeyD') selected = (selected + 1) % CHARACTERS.length;
    if (code === 'Enter' || code === 'Space') startGame();
  } else if (mode === 'over') {
    if (code === 'KeyR' || code === 'Enter') startGame();
    if (code === 'KeyC') mode = 'select';
  }
}

// ---------- Physics (one fixed 1/60s tick) ----------
function update() {
  const p = player, s = p.ch.stats;
  elapsed += STEP;

  // Ice: holding a direction speeds you up; letting go you keep sliding (grip close to 1 = slippery)
  const accel = p.onGround ? s.accel : s.accel * 0.6;
  if (left()) { p.vx -= accel; p.facing = -1; }
  if (right()) { p.vx += accel; p.facing = 1; }
  if (!left() && !right() && p.onGround) p.vx *= s.grip;
  // No normal top speed: the longer you run, the faster you go. The main brake is a little
  // drag (lose 1% of your speed every tick), so speed builds up gradually.
  p.vx *= 0.99;
  p.vx = Math.max(-SPEED_LIMIT, Math.min(SPEED_LIMIT, p.vx));
  if (p.onGround) p.anim += Math.abs(p.vx) * 0.12;

  // The faster you're running, the higher you jump — the core trick of the genre.
  // Jump within a split second of bouncing off a wall for a bonus "wall kick" super jump.
  if (jumpHeld() && p.onGround) {
    const kick = p.wallKick > 0 ? 3 : 0;
    p.vy = -(s.jump + Math.abs(p.vx) * 0.9 + kick);
    p.onGround = false;
    p.squash = 1.3;
    if (kick) { message = 'WALL KICK!'; messageTimer = 45; }
  }
  if (p.wallKick > 0) p.wallKick--;

  p.vy += 0.55;                                 // gravity
  if (!jumpHeld() && p.vy < -4) p.vy += 0.4;    // let go early for a shorter hop
  p.x += p.vx;
  const prevBottom = p.y + PH;
  p.y += p.vy;

  // Walls: hit one fast and you bounce off FASTER than you came in (like the classic genre trick),
  // which opens a short window to time a wall-kick jump
  if (p.x < WALL || p.x + PW > W - WALL) {
    p.x = p.x < WALL ? WALL : W - WALL - PW;
    if (Math.abs(p.vx) > 4) {
      p.vx = -Math.sign(p.vx) * Math.min(Math.abs(p.vx) * 1.15, SPEED_LIMIT);
      p.wallKick = 12;                          // 12 ticks = 0.2 seconds to press jump
      if (!p.onGround && p.vy < 0) p.vy -= 2;   // wall kick: slide up the wall
      p.facing = Math.sign(p.vx);
    } else p.vx = 0;
  }

  // Landing: floors are one-way (you pass through from below, land from above)
  p.onGround = false;
  if (p.vy >= 0) {
    for (const f of floors) {
      const bottom = p.y + PH;
      const overlaps = p.x + PW - 8 > f.x && p.x + 8 < f.x + f.w;
      if (overlaps && prevBottom <= f.y && bottom >= f.y) {
        p.y = f.y - PH; p.vy = 0; p.onGround = true; p.angle = 0; p.squash = 0.8;
        landOn(f.n);
        break;
      }
    }
  }

  // Spin during big jumps, just for style
  if (!p.onGround && p.vy < -15) p.angle += 0.25 * p.facing;
  p.squash += (1 - p.squash) * 0.2;

  // Spawn floors above, drop ones far below
  while (floors[floors.length - 1].y > camY - FLOOR_GAP * 2) floors.push(makeFloor(floors[floors.length - 1].n + 1));
  floors = floors.filter(f => f.y < camY + H + FLOOR_GAP);

  // The tower "comes down": camera starts creeping up after 5s and speeds up over time
  if (elapsed > 5) scrollSpeed = Math.min(5, 0.6 + (elapsed - 5) / 25);
  camY -= scrollSpeed;
  const pushLine = camY + H * 0.3;              // climbing fast pulls the camera up with you
  if (p.y < pushLine) camY -= (pushLine - p.y) * 0.15;

  if (comboTimer > 0 && --comboTimer === 0) endCombo();
  if (messageTimer > 0) messageTimer--;

  if (p.y > camY + H) gameOver();
}

function landOn(n) {
  const p = player;
  // Measure from your highest floor so far, so dropping down and re-climbing old floors can't farm combos
  const gained = n - Math.max(lastFloor, bestFloor);
  if (gained >= 2) {                          // multi-floor jumps build a combo
    combo += gained;
    comboTimer = 180;                         // 3 seconds to keep it going
  } else if (gained !== 0) {
    endCombo();
  }
  lastFloor = n;
  p.floor = n;
  if (n > bestFloor) { score += (n - bestFloor) * 10; bestFloor = n; }
}

function endCombo() {
  if (combo >= 4) {
    score += combo * combo;
    message = combo >= 20 ? `SICK! ${combo} floor combo` : combo >= 10 ? `GREAT! ${combo} floor combo` : `Nice: ${combo} floor combo`;
    messageTimer = 120;
  }
  combo = 0; comboTimer = 0;
}

function gameOver() {
  endCombo();
  mode = 'over';
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('slipup-high', String(highScore)); } catch (e) {}
  }
}

// ---------- Drawing ----------
function drawBackground(offset) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1e3a5f'); g.addColorStop(1, '#4a7ab0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // background bricks scroll slower than the floors (parallax)
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  const bh = 24, shift = ((-offset * 0.5) % bh + bh) % bh;
  for (let y = -bh + shift; y < H; y += bh) {
    const row = Math.floor((y - shift - offset * 0.5) / bh);
    for (let x = (row % 2 ? 0 : -24); x < W; x += 48) ctx.strokeRect(x, y, 48, bh);
  }
}

function drawWalls() {
  ctx.fillStyle = '#9fd3f5';
  ctx.fillRect(0, 0, WALL, H); ctx.fillRect(W - WALL, 0, WALL, H);
  ctx.fillStyle = '#dff3ff';
  ctx.fillRect(WALL - 6, 0, 6, H); ctx.fillRect(W - WALL, 0, 6, H);
}

function drawFloors() {
  for (const f of floors) {
    const y = f.y - camY;
    if (y < -20 || y > H + 20) continue;
    ctx.fillStyle = f.n % 50 === 0 ? '#fbbf24' : '#bfe6ff';
    ctx.fillRect(f.x, y, f.w, 14);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(f.x, y, f.w, 3);               // icy shine on top
    ctx.fillStyle = '#5b8db8';
    ctx.fillRect(f.x, y + 14, f.w, 3);
    if (f.n % 10 === 0) {
      ctx.fillStyle = '#0b1020'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
      ctx.fillText(f.n, f.x + f.w / 2, y + 11);
    }
  }
}

function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px monospace`; ctx.textAlign = align;
  ctx.fillStyle = '#0b1020'; ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawHUD() {
  text(`FLOOR ${player.floor}`, WALL + 8, 26, 16, '#fff', 'left');
  text(`SCORE ${score}`, W - WALL - 8, 26, 16, '#fde047', 'right');
  if (combo >= 2) {
    text(`COMBO x${combo}`, W / 2, 56, 18, '#f472b6');
    ctx.fillStyle = '#f472b6'; ctx.fillRect(W / 2 - 50, 64, 100 * comboTimer / 180, 5);
  }
  if (messageTimer > 0) text(message, W / 2, H / 2 - 120, 22, '#fde047');
  if (elapsed < 5) text('Run, then jump. Faster run = higher jump.', W / 2, H - 30, 13);
}

function drawSelect() {
  drawBackground(0); drawWalls();
  text('MOUNT', W / 2, 88, 40, '#e0f2fe');
  text('NEVEREST', W / 2, 132, 40, '#e0f2fe');
  text('choose your knockoff', W / 2, 165, 16, '#93c5fd');
  const ch = CHARACTERS[selected];
  ctx.save(); ctx.translate(W / 2 - PW, 210); ctx.scale(2, 2);
  drawSprite(ch, 0, 0, 1, 0, 1, performance.now() / 120);
  ctx.restore();
  text(`<  ${ch.name}  >`, W / 2, 360, 20, '#fde047');
  text(`"${ch.bio}"`, W / 2, 390, 13, '#e2e8f0');
  const s = ch.stats;
  text(`speed ${'■'.repeat(Math.round((s.accel - 0.3) * 20))}   jump ${'■'.repeat(Math.round(s.jump - 8))}`, W / 2, 420, 13, '#93c5fd');
  text('← → pick   ENTER start', W / 2, 480, 15);
  text('arrows / WASD move · SPACE jump', W / 2, 505, 13, '#cbd5e1');
  text('tip: jump right after a wall bounce = WALL KICK', W / 2, 528, 12, '#f472b6');
  text(`best: ${highScore}`, W / 2, 560, 14, '#fde047');
  text('All characters are parodies. Not affiliated with any real game.', W / 2, 615, 10, '#94a3b8');
}

function drawPlay() {
  drawBackground(camY);
  drawFloors();
  drawWalls();
  drawSprite(player.ch, player.x, player.y - camY, player.facing, player.angle, player.squash, player.anim, !player.onGround);
  drawHUD();
}

function drawOver() {
  drawPlay();
  ctx.fillStyle = 'rgba(11,16,32,0.75)'; ctx.fillRect(0, 0, W, H);
  text('YOU SLIPPED', W / 2, 220, 40, '#f87171');
  text(`floor ${bestFloor} · score ${score}`, W / 2, 270, 20);
  text(`best ${highScore}`, W / 2, 300, 16, '#fde047');
  text('R retry · C change character', W / 2, 360, 15);
}

// ---------- Main loop: fixed-step physics, draw every frame ----------
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (acc >= STEP) {
    if (mode === 'play') update();
    acc -= STEP;
  }
  if (mode === 'select') drawSelect();
  else if (mode === 'play') drawPlay();
  else drawOver();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
